<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>مقدم طباخكم</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--fg:#f1f5f9;--mu:#94a3b8;--ac:#f97316;--ok:#22c55e;--bad:#ef4444;--bd:#334155}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.w{max-width:560px;margin:0 auto;padding:14px 14px 0}
h1{font-size:20px;margin:6px 0 10px}h2{font-size:17px;margin:14px 0 8px}
.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0;border:1px solid var(--bd)}
.mu{color:var(--mu);font-size:14px}
input{width:100%;padding:14px;border-radius:10px;border:1px solid var(--bd);background:#0b1220;color:var(--fg);font-size:17px;margin:6px 0 10px}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:17px;font-weight:700;margin:8px 0}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.sec{background:#334155}
.row{display:flex;gap:10px}.row>*{flex:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--bd)}
.sw{display:flex;align-items:center;gap:8px;font-weight:700}
.tg{width:64px;height:34px;border-radius:20px;background:#475569;position:relative;border:0;padding:0;flex:none}
.tg::after{content:"";position:absolute;top:3px;right:3px;width:28px;height:28px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--ok)}.tg.on::after{right:33px}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0b1220;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.nav button{flex:1;padding:14px 4px;background:none;border:0;color:var(--mu);font-size:15px;font-weight:700;position:relative}
.nav button.on{color:var(--ac)}
.dot{position:absolute;top:6px;right:50%;margin-right:-26px;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;line-height:20px;text-align:center;padding:0 5px}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:13px;font-weight:700;background:#334155}
.tag.ok{background:var(--ok);color:#052e16}.tag.off{background:var(--bad)}.tag.new{background:#f59e0b;color:#451a03}
.big{font-size:26px;font-weight:800}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:#e2e8f0;color:#0f172a;padding:12px 18px;border-radius:12px;font-weight:700;z-index:50;max-width:90%;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
.cal div{text-align:center;padding:8px 0;border-radius:8px;background:#0b1220;font-size:14px;position:relative}
.cal .h{background:none;color:var(--mu);font-size:12px}
.cal .j{background:var(--ac);color:#fff;font-weight:800}
.cal .t{outline:2px solid var(--ok)}
a{color:#38bdf8}
.off-note{background:#7f1d1d;border-radius:12px;padding:12px;margin:10px 0;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
var SB_URL='https://gnppreizkbhelssugazl.supabase.co',SB_KEY='sb_publishable_DkwqeHAmyh_xnhI7jmijSw_mDStselK';
var sb=null;try{sb=supabase.createClient(SB_URL,SB_KEY)}catch(e){}
var app=document.getElementById('app');
var ME=null,OFF=[],ORD=[],EARN=[],PEND=0,TAB='orders',MONTH=new Date(),LAST=0,TM=null,SEEN={};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ad(s){return String(s==null?'':s).replace(/[٠-٩]/g,function(d){return String(d.charCodeAt(0)-1632)}).replace(/[۰-۹]/g,function(d){return String(d.charCodeAt(0)-1776)})}
function money(n){return Math.round(Number(n)||0).toLocaleString('en-US')+' دينار'}
function toast(m,ms){var d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},ms||2500)}
function errMsg(e){var m=(e&&e.message)||String(e||'');if(/Failed to fetch|NetworkError|network/i.test(m))return 'ما كو إنترنت أو ضعيف، جرب مرة ثانية';if(/JWT|expired/i.test(m))return 'انتهت الجلسة، سجّل دخول من جديد';return m||'صار خطأ'}
function Q(p){return p.then(function(r){if(r.error)throw r.error;return r.data})}
function em(u){var b=new TextEncoder().encode(u.trim().toLowerCase());var h='';for(var i=0;i<b.length;i++)h+=b[i].toString(16).padStart(2,'0');return h+'@tabakhkum.app'}
function beep(){try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;var c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.2;o.start();setTimeout(function(){o.stop();c.close()},350)}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function dstr(d){return d?String(d).slice(0,10):''}
function dname(d){try{var x=new Date(dstr(d)+'T12:00:00');return x.toLocaleDateString('ar-IQ',{weekday:'long',day:'numeric',month:'long'})}catch(e){return dstr(d)}}
var OCC={wedding:'عرس',birthday:'عيد ميلاد',funeral:'فاتحة',eid:'عيد',party:'حفلة',other:'مناسبة',graduation:'تخرج',engagement:'خطوبة',henna:'حنّة'},MEAL={breakfast:'فطور',lunch:'غداء',dinner:'عشاء',snack:'ضيافة'};
function occ(k){return OCC[k]||k||''}function meal(k){return MEAL[k]||k||''}

/* ---------- الدخول ---------- */
function viewLogin(){
 app.innerHTML='<div class="w"><h1>مقدم طباخكم</h1><p class="mu">سجّل دخول بنفس حسابك بتطبيق طباخكم.</p><div class="card"><label>اسم المستخدم</label><input id="u" autocomplete="username" autocapitalize="none"><label>كلمة السر</label><input id="p" type="password" autocomplete="current-password"><button class="btn" id="go">دخول</button></div><p class="mu">ما عندك حساب؟ سوّي حساب عادي من تطبيق طباخكم أول، وبعدها ادخل هنا.</p></div>';
 document.getElementById('go').onclick=async function(ev){
  var u=ad(document.getElementById('u').value.trim()),w=document.getElementById('p').value;
  if(!u||w.length<6)return toast('اكتب الاسم وكلمة السر');
  ev.target.disabled=true;
  try{
   var email=em(u);try{var lr=await sb.rpc('login_email',{p_name:u});if(lr&&lr.data)email=lr.data}catch(e){}
   var r=await sb.auth.signInWithPassword({email:email,password:w});
   if(r.error)throw new Error('الاسم أو كلمة السر غلط');
   await boot();
  }catch(e){toast(errMsg(e),3500)}finally{ev.target.disabled=false}
 };
}
function viewCode(){
 app.innerHTML='<div class="w"><h1>أدخل كود المقدم</h1><p class="mu">الكود تاخذه من إدارة طباخكم.</p><div class="card"><input id="c" maxlength="12" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;letter-spacing:3px;text-align:center;font-size:22px"><button class="btn" id="go">تفعيل</button></div><button class="btn sec" id="out">تسجيل خروج</button></div>';
 document.getElementById('go').onclick=async function(ev){
  var c=ad(document.getElementById('c').value.trim()).toUpperCase();if(c.length<6)return toast('اكتب الكود كامل');
  ev.target.disabled=true;
  try{await Q(sb.rpc('link_provider',{p_code:c}));toast('تم التفعيل');await boot()}catch(e){toast(errMsg(e),3500)}finally{ev.target.disabled=false}
 };
 document.getElementById('out').onclick=logout;
}
async function logout(){try{await sb.auth.signOut()}catch(e){}ME=null;clearInterval(TM);viewLogin()}

/* ---------- البيانات ---------- */
async function loadMe(){var r=await Q(sb.rpc('provider_me'));ME=r&&r.length?r[0]:null}
async function loadAll(quiet){
 try{
  var of=await Q(sb.rpc('provider_open_offers'));OFF=of||[];
  var o=await Q(sb.rpc('provider_orders'));
  var n=0;o.forEach(function(x){if(x.state==='offered'){n++;if(!SEEN[x.booking_id]){SEEN[x.booking_id]=1;if(LAST&&!quiet)beep()}}});
  OFF.forEach(function(x){n++;if(!SEEN['o'+x.booking_id]){SEEN['o'+x.booking_id]=1;if(LAST&&!quiet)beep()}});
  ORD=o;LAST=1;
  var e=await Q(sb.rpc('provider_earnings'));EARN=e||[];
  var p=await Q(sb.rpc('provider_pending_pay'));PEND=Number(p)||0;
  document.title=(n?'('+n+') ':'')+'مقدم طباخكم';
  if(ME&&document.getElementById('body'))render();
 }catch(e){if(!quiet)toast(errMsg(e),3000)}
}

/* ---------- الواجهة ---------- */
function shell(){
 var offered=ORD.filter(function(x){return x.state==='offered'}).length+OFF.length;
 app.innerHTML='<div class="top"><div><b>'+esc(ME.name)+'</b><div class="mu">'+esc(ME.active?'':'حسابك موقوف')+'</div></div><div class="sw"><span id="st">'+(ME.online?'تشغيل':'إطفاء')+'</span><button class="tg'+(ME.online?' on':'')+'" id="tg" aria-label="تشغيل أو إطفاء"></button></div></div><div class="w" id="body"></div><div class="nav"><button data-t="orders">الطلبات'+(offered?'<span class="dot">'+offered+'</span>':'')+'</button><button data-t="cal">الجدول</button><button data-t="earn">الأرباح</button></div>';
 document.getElementById('tg').onclick=async function(ev){
  var want=!ME.online;ev.target.disabled=true;
  try{await Q(sb.rpc('provider_set_online',{p_on:want}));ME.online=want;await loadAll(true);shell();render();toast(want?'صرت تشغيل: توصلك الطلبات':'صرت إطفاء: ما توصلك طلبات جديدة')}catch(e){toast(errMsg(e))}finally{ev.target.disabled=false}
 };
 var bs=app.querySelectorAll('.nav button');for(var i=0;i<bs.length;i++)bs[i].onclick=function(){TAB=this.getAttribute('data-t');shell();render()};
 for(var j=0;j<bs.length;j++)if(bs[j].getAttribute('data-t')===TAB)bs[j].className='on';
}
function render(){
 var b=document.getElementById('body');if(!b)return;
 if(TAB==='orders')b.innerHTML=vOrders();else if(TAB==='cal')b.innerHTML=vCal();else b.innerHTML=vEarn();
 bind(b);
}
function items(l){return (l||[]).map(function(x){return esc(x.name)+' × '+esc(x.qty)}).join('، ')}
function vOrders(){
 var h='';
 if(!ME.online)h+='<div class="off-note">أنت مطفأ. الطلبات الجديدة ما تظهر لك. شغّل المفتاح فوق لما تكون جاهز.</div>';
 var off=ORD.filter(function(x){return x.state==='offered'}),offs=OFF,acc=ORD.filter(function(x){return x.state==='accepted'&&x.status!=='delivered'}),done=ORD.filter(function(x){return x.state==='accepted'&&x.status==='delivered'});
 h+='<h2>طلبات جديدة ('+(off.length+offs.length)+')</h2>';
 h+=offs.map(function(o){return '<div class="card" data-id="'+o.booking_id+'" data-open="1"><span class="tag new">متاح للجميع</span> <b>'+esc(occ(o.occasion))+' - '+esc(meal(o.meal))+'</b><div class="mu" style="margin:6px 0">'+esc(dname(o.event_date))+'<br>المنطقة: '+esc(o.area||'')+'<br>'+items(o.items)+'</div><div>أجرتك: <span class="big">'+money(o.pay)+'</span></div><div class="mu">أول مقدم يقبل ياخذه</div><div class="row"><button class="btn ok" data-a="1">قبول</button><button class="btn sec" data-a="0">تجاهل</button></div></div>'}).join('');
 h+=off.length?off.map(function(o){return '<div class="card" data-id="'+o.booking_id+'"><span class="tag new">جديد</span> <b>'+esc(occ(o.occasion))+' - '+esc(meal(o.meal))+'</b><div class="mu" style="margin:6px 0">'+esc(dname(o.event_date))+'<br>المنطقة: '+esc(o.area||'')+'<br>'+items(o.items)+'</div><div>أجرتك: <span class="big">'+money(o.pay)+'</span></div><div class="row"><button class="btn ok" data-a="1">قبول</button><button class="btn bad" data-a="0">رفض</button></div></div>'}).join(''):(offs.length?'':'<div class="empty">ما كو طلبات جديدة</div>');
 h+='<h2>طلباتي المقبولة ('+acc.length+')</h2>';
 h+=acc.length?acc.map(function(o){var map=(o.lat!=null&&o.lng!=null)?'<a target="_blank" rel="noopener" href="https://www.google.com/maps?q='+Number(o.lat)+','+Number(o.lng)+'">فتح الخريطة</a>':'';return '<div class="card"><span class="tag ok">مقبول</span> <b>'+esc(occ(o.occasion))+' - '+esc(meal(o.meal))+'</b><div class="mu" style="margin:6px 0">'+esc(dname(o.event_date))+'<br>الزبون: '+esc(o.cust_name||'')+'<br>العنوان: '+esc(o.address||o.area||'')+' '+map+'<br>'+items(o.items)+'</div><div>أجرتك: <b>'+money(o.pay)+'</b></div></div>'}).join(''):'<div class="empty">ما كو طلبات مقبولة</div>';
 if(done.length){h+='<h2>تم تقديمها</h2>'+done.slice(0,10).map(function(o){return '<div class="card"><b>'+esc(occ(o.occasion))+'</b> <span class="mu">'+esc(dstr(o.event_date))+'</span> - '+money(o.pay)+'</div>'}).join('')}
 return h;
}
function vCal(){
 var y=MONTH.getFullYear(),m=MONTH.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),start=(first.getDay()+1)%7;
 var jobs={};ORD.forEach(function(o){if(o.state==='accepted'&&o.event_date){var k=dstr(o.event_date);jobs[k]=(jobs[k]||0)+1}});
 var tdy=new Date(),ts=tdy.getFullYear()+'-'+String(tdy.getMonth()+1).padStart(2,'0')+'-'+String(tdy.getDate()).padStart(2,'0');
 var g='',names=['سبت','أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة'];
 names.forEach(function(n){g+='<div class="h">'+n+'</div>'});
 for(var i=0;i<start;i++)g+='<div></div>';
 for(var d=1;d<=days;d++){var k=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');g+='<div class="'+(jobs[k]?'j':'')+(k===ts?' t':'')+'">'+d+'</div>'}
 var mn=first.toLocaleDateString('ar-IQ',{month:'long',year:'numeric'});
 var up=ORD.filter(function(o){return o.state==='accepted'&&o.status!=='delivered'&&dstr(o.event_date)>=ts}).sort(function(a,b){return dstr(a.event_date)<dstr(b.event_date)?-1:1});
 return '<div class="row" style="align-items:center"><button class="btn sec" data-m="1">&rarr; التالي</button><b style="text-align:center">'+esc(mn)+'</b><button class="btn sec" data-m="-1">السابق &larr;</button></div><div class="cal">'+g+'</div><p class="mu">الأيام البرتقالية: عندك طلب. الأخضر: اليوم.</p><h2>القادمة</h2>'+(up.length?up.map(function(o){return '<div class="card"><b>'+esc(dname(o.event_date))+'</b><div class="mu">'+esc(occ(o.occasion))+' - '+esc(meal(o.meal))+' | '+esc(o.area||'')+'</div></div>'}).join(''):'<div class="empty">ما كو أيام محجوزة</div>');
}
function vEarn(){
 var cur=new Date(),k=cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0'),t=0,j=0;
 EARN.forEach(function(e){if(e.month===k){t=Number(e.total);j=Number(e.jobs)}});
 return '<div class="card"><div class="mu">أرباح هذا الشهر</div><div class="big" style="color:var(--ok)">'+money(t)+'</div><div class="mu">'+j+' طلب تم تقديمه</div></div><div class="card"><div class="mu">مستحقات طلبات لسه ما انتهت</div><div class="big">'+money(PEND)+'</div></div><h2>الأشهر السابقة</h2>'+(EARN.length?EARN.map(function(e){return '<div class="card row"><b>'+esc(e.month)+'</b><span>'+Number(e.jobs)+' طلب</span><b>'+money(e.total)+'</b></div>'}).join(''):'<div class="empty">ما كو أرباح بعد</div>')+'<p class="mu">الأجرة تُحسب بعد ما تنتهي الخدمة وتأكدها الإدارة.</p>';
}
function bind(b){
 b.onclick=async function(e){
  var a=e.target.closest&&e.target.closest('[data-a]');
  if(a){
   var card=a.closest('[data-id]'),id=card.getAttribute('data-id'),acc=a.getAttribute('data-a')==='1',open=card.getAttribute('data-open')==='1';
   if(!acc&&!open&&!confirm('ترفض هذا الطلب؟ ما راح يوصل لغيرك من تلقائي، الإدارة تقرر.'))return;
   a.disabled=true;
   try{await Q(sb.rpc(open?'provider_take_offer':'provider_respond',{p_id:id,p_accept:acc}));toast(acc?'تم قبول الطلب':(open?'تم التجاهل':'تم الرفض'));await loadAll(true);shell();render()}catch(x){toast(errMsg(x),3500);a.disabled=false}
   return;
  }
  var m=e.target.closest&&e.target.closest('[data-m]');
  if(m){MONTH=new Date(MONTH.getFullYear(),MONTH.getMonth()+Number(m.getAttribute('data-m')),1);render()}
 };
}

/* ---------- زر الرجوع ---------- */
var BK=0;
function guard(){try{history.pushState({p:1},'')}catch(e){}}
window.addEventListener('popstate',function(){
 if(Date.now()<BK)return history.back();
 BK=Date.now()+2200;toast('اضغط رجوع مرة ثانية للخروج',2000);guard();
});

/* ---------- تشغيل ---------- */
async function boot(){
 try{
  var s=await sb.auth.getSession();
  if(!s||!s.data||!s.data.session)return viewLogin();
  await loadMe();
  if(!ME)return viewCode();
  if(!ME.active){app.innerHTML='<div class="w"><h1>حسابك موقوف</h1><p class="mu">تواصل مع الإدارة.</p><button class="btn sec" id="out">تسجيل خروج</button></div>';document.getElementById('out').onclick=logout;return}
  LAST=0;shell();await loadAll(true);shell();render();
  clearInterval(TM);TM=setInterval(function(){if(!document.hidden)loadAll(false)},20000);
 }catch(e){app.innerHTML='<div class="w"><div class="empty">'+esc(errMsg(e))+'</div><button class="btn" id="rt">إعادة المحاولة</button></div>';document.getElementById('rt').onclick=boot}
}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&ME)loadAll(false)});
window.addEventListener('online',function(){if(ME)loadAll(true)});
if(!sb){app.innerHTML='<div class="w"><div class="empty">تعذر تحميل التطبيق، تأكد من الإنترنت وحدّث الصفحة</div></div>'}else{guard();boot()}
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}catch(e){}
})();
</script>
</body>
</html>
