<title>طباخكم</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#273449;--gold:#d97706;--gold2:#f59e0b;--tx:#f1f5f9;--mu:#94a3b8;--ok:#16a34a;--bad:#dc2626;--line:#334155}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:var(--tx);font-family:system-ui,'Segoe UI',Tahoma,Arial,sans-serif;overflow:hidden}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
input[type=checkbox]{width:auto}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
h3{font-size:18px;margin-bottom:6px}
a{color:var(--gold2)}
.ic{width:24px;height:24px;display:block}
#app{position:relative;max-width:480px;height:100vh;height:calc(var(--vh,1vh)*100);height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden}
.screen{position:absolute;top:0;right:0;bottom:0;left:0;display:none;flex-direction:column;background:var(--bg)}
.screen.on{display:flex}
#feed{background:#000;display:none;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
#feed.on{display:block}
#feed::-webkit-scrollbar{display:none}
.slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;background:#000}
.vwrap{position:absolute;top:0;right:0;bottom:0;left:0}
.vwrap video{width:100%;height:100%;object-fit:cover;background:#000}
.heart{position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px 0 0 -45px;color:#ef4444;opacity:0;pointer-events:none;transform:scale(.4)}
.heart svg{fill:#ef4444;stroke:#ef4444;width:100%;height:100%}
.heart.go{animation:hp .7s ease-out}
.pico{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transform:scale(.8);transition:opacity .15s,transform .15s}
.slide.upz .pico{opacity:1;transform:scale(1)}
@keyframes hp{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1.3)}}
.bar{position:absolute;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));height:3px;background:rgba(255,255,255,.22);direction:ltr;touch-action:none;z-index:6;transition:height .12s}
.bar::before{content:'';position:absolute;left:0;right:0;top:-20px;bottom:-6px}
.bar i{display:block;height:100%;width:0;background:var(--gold2);position:relative}
.bar i::after{content:'';position:absolute;right:-7px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--gold2);border:2px solid #fff;opacity:0;transition:opacity .12s}
.bar.seek{height:7px}.bar.seek i::after{opacity:1}
.tm{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(170px + env(safe-area-inset-bottom));z-index:7;background:rgba(0,0,0,.7);color:#fff;font-size:15px;font-weight:700;padding:5px 12px;border-radius:10px;direction:ltr;display:none;pointer-events:none}
.tm.on{display:block}
.slide{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.slide .cap .ct{-webkit-user-select:none;user-select:none}
#app.clean .acts,#app.clean .cap,#app.clean .bar,#app.clean .tm,#app.clean #top,#app.clean #nav,#app.clean #fab,#app.clean #tagbar,#app.clean #cartbar{display:none!important}
.cdesc{background:var(--card);border-radius:12px;padding:10px 12px;margin:6px 0 8px;max-height:calc(var(--vh,1vh)*20);overflow-y:auto;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.cdesc .ctm{font-size:12px;opacity:.6;margin-inline-start:6px}
.cdesc .tg{color:var(--gold2);font-weight:700}
.wmb{height:8px;border-radius:4px;background:var(--card2);overflow:hidden;margin:10px 0}.wmb i{display:block;height:100%;width:0;background:var(--gold2)}
.acts{position:absolute;left:10px;bottom:calc(76px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:16px;z-index:5}
.ab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;text-shadow:0 1px 3px #000}
.ab .ic{width:32px;height:32px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.7))}
.ab.on .ic{fill:#ef4444;stroke:#ef4444}
.av{width:46px;height:46px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;border:2px solid #fff;position:relative}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.fol{z-index:2;border:2px solid #000;box-sizing:content-box;position:absolute;bottom:-12px;left:50%;margin-left:-12px;width:20px;height:20px;border-radius:50%;background:var(--bad);display:flex;align-items:center;justify-content:center}
.fol .ic{width:14px;height:14px}
.cap{position:absolute;right:12px;left:78px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:5;font-size:13px;line-height:1.55;background:rgba(0,0,0,.34);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);border-radius:14px;padding:8px 11px}
.cap b{font-size:14px}
.cap .dt{font-size:11px;opacity:.75;margin-inline-start:8px}
.cap .ct{margin-top:3px;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cap.open .ct{display:block;max-height:calc(var(--vh,1vh)*32);overflow-y:auto;-webkit-line-clamp:unset}
.cap .tg{color:#fbbf24;font-weight:700}
.cap .more{color:#fff;opacity:.9;font-size:12px;font-weight:700;margin-top:3px;padding:3px 0}
.disc{width:46px;height:46px;border-radius:50%;background:conic-gradient(#222,#555,#222,#555,#222);display:flex;align-items:center;justify-content:center;animation:spin 5s linear infinite;border:6px solid #1a1a1a}
.disc i{width:22px;height:22px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:11px;font-style:normal;font-weight:700;overflow:hidden}
.disc i img{width:100%;height:100%;object-fit:cover}
@keyframes spin{to{transform:rotate(360deg)}}
.cm{font-size:16px!important;padding:12px 0!important;gap:10px!important}
.cav{width:38px;height:38px;border-radius:50%;background:var(--gold);flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden}
.cav img{width:100%;height:100%;object-fit:cover}
.ab.sv.on .ic{fill:#fbbf24;stroke:#fbbf24}
.rpb{font-size:12px;opacity:.85;display:flex;align-items:center;gap:5px;margin-bottom:2px}
.rpb:empty{display:none}.rpb .ic{width:14px;height:14px}
.vsb{font-size:11px;background:rgba(255,255,255,.18);border-radius:8px;padding:1px 7px;margin-inline-start:6px}
#tagbar{position:absolute;top:calc(58px + env(safe-area-inset-top));left:12px;right:12px;z-index:21;display:none;align-items:center;gap:10px;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:8px 12px;font-size:14px}
#tagbar b{color:#fbbf24;font-size:16px}#tagbar .mu{flex:1;color:#ddd}
#tagbar button{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
#tagbar .ic{width:14px;height:14px}
.ptabs{display:flex;border-bottom:1px solid var(--line);margin-top:14px}
.ptabs button{flex:1;padding:11px 2px;font-size:13px;color:var(--mu);border-bottom:3px solid transparent}
.ptabs button.on{color:var(--tx);font-weight:700;border-bottom-color:var(--gold2)}
.pbio{margin:8px auto 0;max-width:320px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.pstat>div.lk{cursor:pointer}
.sbg.full{align-items:stretch;background:#0b1220}
.sbg.full .sh{max-height:none;height:100%;border-radius:0;display:flex;flex-direction:column;padding-top:calc(10px + env(safe-area-inset-top))}
.sbg.full .grab{display:none}
.sbg.full #nl{flex:1;overflow-y:auto}
.nhd{display:flex;align-items:center;gap:10px;margin-bottom:10px}.nhd button{padding:6px}.nhd h3{margin:0}
.frow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cm .ctm{font-size:12px;opacity:.6;font-weight:400;margin-inline-start:6px}
#top{position:absolute;top:0;left:0;right:0;z-index:20;display:none;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 18px;background:linear-gradient(#000a,transparent);pointer-events:none}
#top>*{pointer-events:auto}
#top button{padding:6px}
#logo{font-weight:800;font-size:20px;color:var(--gold2);letter-spacing:.5px;text-shadow:0 1px 4px #000;user-select:none}
#fab{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;padding:13px 26px;border-radius:30px;background:rgba(217,119,6,.5);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font-weight:800;font-size:16px;text-shadow:0 1px 3px rgba(0,0,0,.8);white-space:nowrap}
#logo{flex:1}
#bMenu{flex:none;display:flex;justify-content:flex-end}
#svcBtn{flex:none;margin-inline:6px 10px;padding:7px 15px;border-radius:20px;background:rgba(217,119,6,.85);border:1px solid rgba(255,255,255,.4);color:#fff;font-size:13px;font-weight:700;text-shadow:none}
#nav{position:absolute;left:0;right:0;bottom:0;z-index:30;display:none;align-items:center;justify-content:space-around;height:calc(60px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#000;border-top:1px solid #222}
#nav .nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:#fff;padding:6px 0}
#nav .nb{position:relative}
#nav .nb.on{color:var(--gold2)}
.bdg{position:absolute;top:0;left:50%;margin-left:4px;background:var(--bad);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:none;align-items:center;justify-content:center;padding:0 3px}
#nav .nb .ic{width:24px;height:24px}
#nav .npl{flex:1;display:flex;justify-content:center}
#nav .npl span{width:54px;height:36px;border-radius:11px;background:var(--gold);display:flex;align-items:center;justify-content:center}
#nav .npl .ic{width:24px;height:24px}
#fab:active{background:rgba(217,119,6,.75)}
#splash{position:absolute;top:0;right:0;bottom:0;left:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .35s}
#splash.out{opacity:0;pointer-events:none}
#splash .lg{font-size:46px;font-weight:900;color:var(--gold2);letter-spacing:1px}
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:90px;z-index:200;background:#111c;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;max-width:88%;text-align:center;display:none;backdrop-filter:blur(6px)}
.hd{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid var(--line);flex:none}
.hd b{flex:1;font-size:17px}
.hd button{padding:6px}
.bd{flex:1;overflow-y:auto;padding:14px 14px 140px}
.btn{display:block;width:100%;padding:13px;border-radius:12px;background:var(--gold);color:#fff;font-weight:700;font-size:16px;margin-top:14px;text-align:center}
.btn.sec{background:var(--card2)}
.btn.bad{background:var(--bad)}
.btn.sm{display:inline-block;width:auto;padding:7px 12px;font-size:13px;margin:4px 4px 0 0;border-radius:9px}
.btn:disabled{opacity:.5}
.lnk{display:block;margin:12px auto 0;color:var(--gold2);font-size:14px;text-decoration:underline}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px}
.mu{color:var(--mu);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 12px;text-align:center;font-size:17px;font-weight:700}
.big:active{border-color:var(--gold)}
.big.off{opacity:.45}
.big small{display:block;font-weight:400;color:var(--mu);font-size:12px;margin-top:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:20px;background:var(--card);white-space:nowrap;font-size:14px}
.tab.on{background:var(--gold);color:#fff;font-weight:700}
.cat{margin:14px 0 8px;font-weight:700;color:var(--gold2);font-size:15px}
.it{display:flex;gap:10px;background:var(--card);border-radius:14px;padding:8px;margin-bottom:8px;align-items:center}
.it .ph{width:68px;height:68px;border-radius:10px;background:linear-gradient(135deg,#334155,#1e293b);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--mu);font-weight:800;font-size:22px}
.it .ph img{width:100%;height:100%;object-fit:cover}
.it .in{flex:1;min-width:0}
.it .nm{font-weight:700;font-size:15px}
.it .pr{font-size:13px;color:var(--gold2);margin-top:2px}
.it .pr s{color:var(--mu);margin-left:6px}
.qty{display:flex;align-items:center;gap:8px;flex:none}
.qty button{width:32px;height:32px;border-radius:50%;background:var(--card2);font-size:20px;font-weight:700;line-height:1}
.qty button.p{background:var(--gold)}
.qty span{min-width:20px;text-align:center;font-weight:700}
#cartbar{position:absolute;left:10px;right:10px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:25;background:var(--card2);border:1px solid var(--gold);border-radius:14px;padding:10px 12px;display:none;align-items:center;justify-content:space-between;gap:10px}
#cartbar.on{display:flex}
#cartbar .btn{margin:0;width:auto;padding:10px 18px}
.sbg{position:absolute;top:0;right:0;bottom:0;left:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
.sh{width:100%;max-height:calc(var(--vh,1vh)*90);overflow-y:auto;background:#111c33;border-radius:20px 20px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom))}
.grab{width:42px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 12px}
.chip{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;background:var(--card2)}
.chip.new{background:#1d4ed8}.chip.confirmed{background:#7c3aed}.chip.provider_found{background:#0e7490}.chip.delivered{background:var(--ok)}.chip.cancelled{background:var(--bad)}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.msgs{max-height:calc(var(--vh,1vh)*48);overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px 0}
.msg{max-width:80%;padding:8px 11px;border-radius:12px;background:var(--card2);font-size:14px;word-break:break-word}
.msg.me{background:var(--gold);align-self:flex-start}
.msg.st{align-self:flex-end}
.cm{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.cm b{color:var(--gold2)}
.stars{display:flex;gap:6px;justify-content:center;margin:12px 0}
.stars button{font-size:34px;color:var(--line)}
.stars button.on{color:var(--gold2)}
.pstat{display:flex;justify-content:space-around;text-align:center;margin:12px 0}
.pstat b{display:block;font-size:18px}
.hrow{display:flex;gap:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 2px 12px;margin-top:6px}
.hrow .btn{flex:none;width:auto;min-width:92px;margin:0;padding:12px 12px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:14px}
.hrow .btn .ic{width:28px;height:28px}
.trs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.trs .trc{padding:9px 13px;border-radius:20px;background:var(--card,#1e293b);border:1px solid var(--bd,#334155);font-size:14px}
.trs .trc b{color:var(--gold2)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.tile{position:relative;aspect-ratio:9/14;background:#000;overflow:hidden;border-radius:6px}
.tile video{width:100%;height:100%;object-fit:cover}
.tile span{position:absolute;bottom:3px;right:5px;font-size:11px;text-shadow:0 1px 2px #000}
.tile .x{position:absolute;top:3px;left:3px;background:#000a;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:14px}
.tile .hid{position:absolute;top:3px;right:3px;background:var(--bad);font-size:10px;padding:1px 5px;border-radius:6px}
.pbar{height:8px;background:var(--card2);border-radius:5px;overflow:hidden;margin:8px 0}
.pbar i{display:block;height:100%;background:var(--gold2)}
.rec{position:absolute;top:0;right:0;bottom:0;left:0;z-index:90;background:#000;display:flex;flex-direction:column}
.rec video{flex:1;min-height:0;width:100%;object-fit:cover}

.rec .shot i{display:block;width:46px;height:46px;border-radius:50%;background:var(--bad)}
.rec .shot.on i{width:26px;height:26px;border-radius:6px}

.oc .l{font-size:13px;color:var(--mu);line-height:1.8}
.oc .l b{color:var(--tx)}
table{width:100%;border-collapse:collapse;font-size:13px}

.perm{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px}
.empty{padding:50px 20px;text-align:center;color:var(--mu)}
/* ===== الإعدادات والمظهر ===== */
.sh{background:var(--shbg,#111c33)}
#toast{background:#0f172af2;color:#f1f5f9}

const S={user:null,me:null,priv:null,adm:null,set:{},cats:[],items:[],cart:{},occ:null,meal:null,tab:'cooks',step:'occ',screen:'feed'};
const can=p=>!!(S.adm&&(S.adm.role==='owner'||(S.adm.perms&&S.adm.perms[p]===true)));

async function loadSettings(){try{const r=await Q(sb.from('settings').select('*'));S.set={};r.forEach(x=>S.set[x.key]=x.value)}catch(e){}}
async function loadCatalog(){try{
 const [c,i]=await Promise.all([Q(sb.from('categories').select('*').order('sort')),Q(sb.from('items').select('id,category_id,name,unit,price,discount,image_url,occasions,active,sort').order('sort'))]);
 S.cats=c;S.items=i;
 Object.keys(S.cart).forEach(id=>{if(!S.items.find(x=>x.id===id&&x.active))delete S.cart[id]});saveCart();
}catch(e){}}
async function loadMe(){
 S.me=S.priv=S.adm=null;
 let sess=null;try{const {data}=await sb.auth.getSession();sess=data.session;S.user=sess?sess.user:null}catch(e){S.user=null}
 if(S.user){
  try{const COLS='id,username,avatar_url,bio,is_private,deactivated,comments_from,repost_from,allow_dl,default_vis,vis_follows,vis_likes,vis_reposts';
   const [a0,b,c]=await Promise.all([
   sb.from('profiles').select(COLS).eq('id',S.user.id).maybeSingle(),
   sb.from('user_private').select('phone,phone_verified,banned').eq('user_id',S.user.id).maybeSingle(),
   sb.from('admins').select('role,perms').eq('user_id',S.user.id).maybeSingle()]);
   let a=a0;if(a.error)a=await sb.from('profiles').select('id,username,avatar_url,bio').eq('id',S.user.id).maybeSingle();
   S.me=a.data;S.priv=b.data;S.adm=c.data;

  }catch(e){}
 }

const em=u=>[...new TextEncoder().encode(u.trim().toLowerCase())].map(b=>b.toString(16).padStart(2,'0')).join('')+'@tabakhkum.app';
function requireAuth(cb){if(S.user&&S.me){cb();return}authSheet(cb,'login')}
function authSheet(cb,mode){
 const reg=mode==='reg';
 const s=sheet(`<h3>${t(reg?'register':'login')}</h3>
  <label>${t('username')}</label><input id="au" maxlength="14" autocomplete="username">
  ${reg?`<label>${t('phone')}</label><input id="ap" type="tel" inputmode="tel" placeholder="07xxxxxxxxx">`:''}
  <label>${t('password')}</label><input id="aw" type="password" autocomplete="${reg?'new-password':'current-password'}">
  ${reg?`<label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--tx);margin-top:12px"><input type="checkbox" id="atm" style="margin-top:3px"><span>أقر بأن عمري 18 سنة أو أكثر وأوافق على <a href="#" id="atl">شروط الاستخدام</a></span></label>`:''}
  <button class="btn" id="ago">${t(reg?'register':'login')}</button>
  <button class="lnk" id="asw">${t(reg?'hasacc':'noacc')}</button>`);
 s.querySelector('#asw').onclick=()=>{s.close();authSheet(cb,reg?'login':'reg')};
 const atl=s.querySelector('#atl');if(atl)atl.onclick=e=>{e.preventDefault();termsSheet()};
 s.querySelector('#ago').onclick=async ev=>{
  const u=s.querySelector('#au').value.trim(),w=s.querySelector('#aw').value,ph=reg?s.querySelector('#ap').value:'';
  if(u.length<2||u.length>14)return toast(t('baduser'));
  if(w.length<6)return toast(t('shortpw'));
  if(reg&&(norm(ph).length<10||norm(ph).length>15))return toast(t('badphone'));
  if(reg&&!s.querySelector('#atm').checked)return toast('لازم توافق على الشروط وتؤكد عمرك 18 سنة فأكثر',4000);
  if(ev.target.disabled)return;
  ev.target.disabled=true;
  try{
   if(reg){
    const ex=await Q(sb.rpc('login_email',{p_name:u}));
    if(ex)throw new Error(t('dup'));
    try{const bad=await sb.rpc('name_problem',{p_name:u});if(bad&&bad.data)throw new Error(bad.data)}catch(e){if(e&&e.message&&!/function|schema|PGRST/i.test(e.message))throw e}
    const {data,error}=await sb.auth.signUp({email:em(u),password:w});
    if(error){if(/registered|exists/i.test(error.message||''))throw new Error(t('dup'));throw error}
    if(!data.session)throw new Error(t('confirmoff'));
    try{await Q(sb.from('profiles').insert({id:data.user.id,username:u,terms_at:new Date().toISOString()}))}
    catch(e1){
     try{await Q(sb.from('profiles').insert({id:data.user.id,username:u}))}
     catch(e2){try{await sb.auth.signOut()}catch(x){}throw e2}
    }
    try{await sb.from('profiles').update({terms_at:new Date().toISOString()}).eq('id',data.user.id)}catch(e){}
    try{await Q(sb.rpc('register_private',{p_phone:ad(ph)}))}catch(e3){toast('تم إنشاء الحساب، لكن تعذر حفظ الرقم، أضفه لاحقاً من الإعدادات',5000)}
   }else{
    let email=em(u);try{const lr=await sb.rpc('login_email',{p_name:u});if(lr.data)email=lr.data}catch(e){}
    const {error}=await sb.auth.signInWithPassword({email,password:w});
    if(error)throw new Error(t('badlogin'));
   }
   s.close();await loadMe();toast(S.me?S.me.username:'');
   checkRating();cb&&cb();if(reg)setTimeout(verifySheet,500);
  }catch(e){toast(errMsg(e))}finally{ev.target.disabled=false}
 };
}

function go(n){
 const prevS=S.screen;if(n!=='feed'&&prevS!==n)pushOne();
 S.screen=n;try{resetBars()}catch(e){}
 ['feed','flow','prof','adm'].forEach(x=>$('#'+x).classList.toggle('on',x===n));
 $('#top').style.display=(n==='feed'&&!F.custom)?'flex':'none';$('#vback').style.display=(n==='feed'&&F.custom)?'flex':'none';
 $('#fab').style.display=(n==='adm'||n==='feed'||n==='prof')?'none':'block';
 $('#nav').style.display=n==='feed'?'flex':'none';
 $('#app').classList.toggle('insvc',n==='flow');if(n!=='flow')$('#app').classList.remove('sbh');
 $('#fab').style.bottom=n==='feed'?'calc(70px + env(safe-area-inset-bottom))':'';
 $('#fab').textContent=n==='feed'?t('services'):t('reels');
 if(n!=='feed')pauseAll();else resumeCur();
 cartBar();
}

function searchSheet(){
 const s=sheet(`<h3>بحث بالريلز</h3><div class="row"><input id="si" maxlength="40" placeholder="حساب أو كلمة بالوصف أو #هاشتاك" enterkeyhint="search"><button class="btn sm" id="sg" style="flex:none;margin:0">بحث</button></div><div id="sr" style="margin-top:10px;max-height:calc(var(--vh,1vh)*62);overflow-y:auto"><div class="mu">الهاشتاكات الرائجة</div><div class="trs" id="trs"><span class="mu">...</span></div></div>`);
 const inp=s.querySelector('#si'),out=s.querySelector('#sr');
 (async()=>{try{const r=await Q(sb.rpc('trending_tags',{p_days:7,p_limit:15}));const x=s.querySelector('#trs');if(!x)return;x.innerHTML=(r&&r.length)?r.map(a=>`<span class="trc" data-tag="${esc(a.tag)}"><b>#${esc(a.tag)}</b> <span class="mu">${a.videos} فيديو - ${a.users} مستخدم</span></span>`).join(''):'<span class="mu">ما كو هاشتاكات بعد. اكتب #هاشتاك بوصف منشورك.</span>'}catch(e){const x=s.querySelector('#trs');if(x)x.innerHTML=''}})();
 const run=async()=>{
  const raw=inp.value.trim(),q=raw.replace(/^[@#]+/,'').trim();
  if(q.length<2){if(raw)toast('اكتب حرفين على الأقل');return}
  out.innerHTML='<div class="empty">...</div>';
  const lk='%'+q.replace(/[\\%_]/g,'\\$&')+'%';
  try{
   const [u,rv]=await Promise.all([
    sb.from('profiles').select('id,username,avatar_url').ilike('username',lk).limit(15),
    sb.from('reels').select('id,video_url,views,caption').ilike('caption',lk).is('deleted_at',null).eq('hidden',false).order('created_at',{ascending:false}).limit(30)]);
   let h='';
   if(/^#/.test(raw)||/^[\p{L}\p{N}_]+$/u.test(q))h+=`<div class="srrow" data-tag="${esc(q)}"><b style="color:var(--gold2)">#${esc(q)}</b><span class="mu" style="flex:1">افتح فيديوهات الهاشتاك</span></div>`;
   const us=(u.data||[]);
   if(us.length)h+=hd('الحسابات')+us.map(x=>`<div class="srrow" data-u="${x.id}"><div class="cav">${x.avatar_url?`<img src="${esc(x.avatar_url)}" alt="">`:esc((x.username||'?').slice(0,1))}</div><b style="flex:1">@${esc(x.username)}</b></div>`).join('');
   let up=[];
   if(us.length){try{const ids=us.slice(0,3).map(x=>x.id);const pr=await sb.from('reels').select('id,video_url,views,user_id').in('user_id',ids).is('deleted_at',null).eq('hidden',false).order('created_at',{ascending:false}).limit(30);up=pr.data||[]}catch(e){}}
   if(up.length)h+=hd('منشورات '+(us.length>1?'الحسابات':'@'+us[0].username))+`<div class="tiles">${up.map(y=>`<div class="tile" data-r="${y.id}"><video src="${esc(y.video_url)}#t=0.5" preload="metadata" muted playsinline></video><span>${y.views||0}</span></div>`).join('')}</div>`;
   const upIds=new Set(up.map(y=>y.id));
   const rs=(rv.data||[]).filter(y=>!upIds.has(y.id));
   if(rs.length)h+=hd('الفيديوهات')+`<div class="tiles">${rs.map(y=>`<div class="tile" data-r="${y.id}"><video src="${esc(y.video_url)}#t=0.5" preload="metadata" muted playsinline></video><span>${y.views||0}</span></div>`).join('')}</div>`;
   out.innerHTML=h||'<div class="empty">ما لقيت نتائج</div>';
  }catch(e){out.innerHTML=`<div class="empty">${esc(errMsg(e))}</div>`}
 };
 s.querySelector('#sg').onclick=run;inp.onkeydown=e=>{if(e.key==='Enter'){clearTimeout(inp._t);run()}};
 inp.oninput=()=>{clearTimeout(inp._t);const q=inp.value.replace(/^[@#]+/,'').trim();if(q.length>=2)inp._t=setTimeout(()=>{if(s.parentNode)run()},500)};
 out.onclick=e=>{
  const g=e.target.closest('[data-tag]');if(g){s.close();openTag(g.dataset.tag);return}
  const u=e.target.closest('[data-u]');if(u){s.close();openProfile(u.dataset.u);return}
  const r=e.target.closest('[data-r]');if(r){s.close();showReel(r.dataset.r)}
 };
 setTimeout(()=>inp.focus(),150);
}
async function viewReels(ids,startId,back,fallbackUrl){
 try{
  if(!ids.length)throw new Error('x');
  let ids2=ids;if(ids.length>100){const i0=Math.max(0,ids.indexOf(startId)-10);ids2=ids.slice(i0,i0+100)}
  const rows=await Q(sb.rpc('reels_by_ids',{p_ids:ids2}));
  if(!rows||!rows.length)throw new Error('x');
  try{await attachSnd(rows)}catch(e){}
  hideTag();F.tok++;F.busy=false;F.end=true;F.cur=null;F.seen=new Set();F.custom={back};pushOne();
  $('#feed').innerHTML='';
  go('feed');
  rows.forEach(r=>{F.seen.add(r.id);addSlide(r)});
  const el=$('#feed').querySelector('.slide[data-id="'+startId+'"]');
  if(el)requestAnimationFrame(()=>el.scrollIntoView());
 }catch(e){
  F.custom=null;
  if(fallbackUrl)sheet(`<video src="${esc(fallbackUrl)}" controls autoplay playsinline style="width:100%;max-height:calc(var(--vh,1vh)*70);border-radius:12px;background:#000"></video>`,()=>{});
  else toast(errMsg(e))
 }
}

function showReel(id){RID=id;hideTag();F.mode='all';setTabs();go('feed');reloadFeed()}
function reloadFeed(){F.custom=null;$('#vback').style.display='none';if(S.screen==='feed')$('#top').style.display='flex';F.tok++;F.busy=false;F.off=0;F.end=false;F.seen=new Set();F.cur=null;$('#feed').innerHTML='';loadMore(true)}
async function loadMore(first){
 if(F.busy||F.end||F.custom)return;F.busy=true;const tok=F.tok,fr=F.mode==='fr';
 try{
  let rows=[];
  if(first&&RID&&!fr&&!F.tag){const r=await sb.rpc('feed',{p_offset:0,p_limit:1,p_id:RID});rows=r.data||[];RID=null}
  let d=[],tries=0;const lim=fr?30:8;
  while(true){
   const x=await Q(sb.rpc('feed',F.tag?{p_offset:F.off,p_limit:lim,p_tag:F.tag}:{p_offset:F.off,p_limit:lim}));
   if(tok!==F.tok)return;
   F.off+=x.length;if(x.length<lim)F.end=true;
   d=d.concat(fr?x.filter(r=>r.following||r.reposted_by):x);
   if(d.length>=1||F.end||!fr||++tries>4)break;
  }
  rows=rows.concat(d).filter(x=>!F.seen.has(x.id));
  try{await attachSnd(rows)}catch(e){}
  if(tok!==F.tok)return;
  rows.forEach(x=>{F.seen.add(x.id);addSlide(x)});
  if(!$('#feed').children.length)$('#feed').innerHTML=`<div class="empty" style="padding-top:calc(var(--vh,1vh)*40)">${t(fr?'nofr':'nofeed')}</div>`;
 }catch(e){
  if(tok!==F.tok)return;
  if(!$('#feed').querySelector('.slide'))$('#feed').innerHTML=`<div class="empty" style="padding-top:calc(var(--vh,1vh)*40)">${esc(errMsg(e))}<br><button class="btn sm" id="rtry">${t('retry')}</button></div>`,$('#rtry').onclick=()=>{$('#feed').innerHTML='';loadMore(true)};
 }
 F.busy=false;
}

 const bar=el.querySelector('.bar'),bi=bar.querySelector('i'),tm=el.querySelector('.tm');
 v.addEventListener('timeupdate',()=>{if(!bar.classList.contains('seek')&&isFinite(v.duration)&&v.duration)bi.style.width=(v.currentTime/v.duration*100)+'%'});
 const mmss=x=>{x=Math.max(0,Math.floor(x||0));return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')};
 let wasPlaying=false;
 const seekTo=e=>{if(!isFinite(v.duration)||!v.duration)return;const rc=bar.getBoundingClientRect();const p=Math.min(1,Math.max(0,(e.clientX-rc.left)/rc.width));bi.style.width=(p*100)+'%';v.currentTime=p*v.duration;tm.textContent=mmss(p*v.duration)+' / '+mmss(v.duration)};
 bar.addEventListener('pointerdown',e=>{e.stopPropagation();if(!isFinite(v.duration)||!v.duration)return;try{bar.setPointerCapture(e.pointerId)}catch(x){}wasPlaying=!v.paused;v.pause();bar.classList.add('seek');tm.classList.add('on');seekTo(e)});
 bar.addEventListener('pointermove',e=>{if(bar.classList.contains('seek'))seekTo(e)});
 const endSeek=()=>{if(!bar.classList.contains('seek'))return;bar.classList.remove('seek');tm.classList.remove('on');if(wasPlaying)v.play().catch(()=>{})};
 bar.addEventListener('pointerup',endSeek);bar.addEventListener('pointercancel',endSeek);

function sndAttach(el){

 const v=el.querySelector('video'),a=new Audio();a.preload='auto';a.src=r.snd.url;a.muted=!F.sound;a.playbackRate=v.playbackRate||1;el._a=a;
 el._ae=[['play',()=>{a.muted=!F.sound;a.play().catch(()=>{})}],['pause',()=>a.pause()],['seeked',()=>{try{a.currentTime=v.currentTime}catch(x){}}],['ratechange',()=>{a.playbackRate=v.playbackRate}],['timeupdate',()=>{if(!a.paused&&Math.abs(a.currentTime-v.currentTime)>.35){try{a.currentTime=v.currentTime}catch(x){}}}]];
 el._ae.forEach(x=>v.addEventListener(x[0],x[1]));
 v.muted=true;if(!v.paused)a.play().catch(()=>{});
}
function sndDetach(el){

 (el._ae||[]).forEach(x=>v.removeEventListener(x[0],x[1]));

async function attachSnd(rows){

 const ids=[...new Set(Object.values(m))];if(!ids.length)return;
 const b=await sb.from('reels').select('id,video_url,profiles(username,avatar_url)').in('id',ids);
 if(b.error||!b.data)return;
 const M={};b.data.forEach(x=>M[x.id]=x);
 rows.forEach(r=>{const x=M[m[r.id]];if(x)r.snd={id:x.id,url:x.video_url,username:x.profiles&&x.profiles.username,avatar:x.profiles&&x.profiles.avatar_url}});
}

async function saveWm(sl){

    <button class="btn" id="wmD">حفظ بالجهاز</button>${canShare?'<button class="btn sec" id="wmH">مشاركة</button>':''}<button class="btn sec" id="wmC">إغلاق</button>`;
   s.querySelector('#wmD').onclick=()=>{const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();toast('بدأ الحفظ، تلكاه بالتنزيلات')};

function listPage(title,key,ph,hint,norm2){
 return {t:title,r:async(a,post)=>{
  if(!needMe())return '';
  const arr=(S.up.prefs[key]||[]);
  post(box=>{
   const add=async()=>{const i=box.querySelector('#li'),v=norm2(i.value);if(!v)return;if(arr.includes(v)){i.value='';return}
    if(arr.length>=50)return toast('الحد الأقصى 50');
    arr.push(v);S.up.prefs[key]=arr;try{await saveUP();i.value='';reloadFeed();reP()}catch(e){arr.pop();toast(errMsg(e))}};
   box.querySelector('#lg').onclick=add;box.querySelector('#li').onkeydown=e=>{if(e.key==='Enter')add()};
   box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{const v=arr[+b.dataset.rm];arr.splice(+b.dataset.rm,1);S.up.prefs[key]=arr;try{await saveUP();reloadFeed();reP()}catch(e){arr.push(v);toast(errMsg(e))}});
  });
  return `<div class="row"><input id="li" maxlength="30" placeholder="${esc(ph)}"><button class="btn sm" id="lg" style="flex:none;margin:0">إضافة</button></div>
   <div class="chips">${arr.map((w,i)=>`<span class="chip">${esc(w)}<button data-rm="${i}">${ic('x')}</button></span>`).join('')}</div>${arr.length?'':'<div class="empty" style="padding:24px">لا يوجد شي</div>'}${nt(hint)}`;
 }};
}

async function shareProfile(name){
 const n=typeof name==='string'?name:(S.me&&S.me.username);if(!n)return;
 const url=location.origin+location.pathname+'?u='+encodeURIComponent(n);
 try{if(navigator.share){await navigator.share({title:'طباخكم',text:'@'+n,url});return}}catch(e){if(e&&e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(url);toast('تم نسخ رابط الملف الشخصي')}catch(e){toast(url,6000)}
}
async function openByName(u){

function profMenu(uid,p,rel,after){
 const nm=p.username;

  try{
   if(k==='mu'){

 };

/* ===== زر الرجوع بالموبايل: يغلق الطبقة العليا بدل الخروج من التطبيق ===== */
let HOK=0,HG=0,HD=0,HSKIP=0,HARM=0,HST=0;
const layers=()=>document.querySelectorAll('#app>.sbg').length+(document.querySelector('#app>.rec')?1:0)
 +(S.screen!=='feed'?1:0)+(F.custom?1:0)+(S.screen==='flow'?(S.step==='svc'?2:S.step==='meal'?1:0):0);
const hPush=()=>{try{history.pushState({tk:1},'');return 1}catch(e){return 0}};
['pointerup','touchend','click','keydown'].forEach(n=>window.addEventListener(n,()=>{HOK=1},true));
function hSync(){
 if(!HOK||HSKIP)return;
 if(!HG&&HD===0&&Date.now()>HARM&&hPush())HG=1;
 const n=layers();
 while(HD<n&&hPush())HD++;
 if(HD>n){const k=HD-n;HD=n;HSKIP++;clearTimeout(HST);HST=setTimeout(()=>{HSKIP=0},1500);try{history.go(-k)}catch(e){HSKIP=0}}
}
setInterval(hSync,150);
function hClose(){
 const rec=document.querySelector('#app>.rec');if(rec){const x=rec.querySelector('#rx');if(x)x.click();return}
 const sh=[...document.querySelectorAll('#app>.sbg')];
 if(sh.length){const top=sh[sh.length-1];if(top.close)top.close();else top.remove();return}
 if(S.screen==='flow'&&S.step==='svc'){S.step='meal';renderFlow();return}
 if(S.screen==='flow'&&S.step==='meal'){S.step='occ';renderFlow();return}
 if(S.screen!=='feed'){go('feed');return}
 if(F.custom){const b=$('#vback');if(b)b.click()}
}
window.addEventListener('popstate',()=>{
 if(HSKIP>0){HSKIP--;if(!HSKIP)clearTimeout(HST);return}
 if(HD>0){HD--;hClose();return}
 HG=0;
 if(layers()>0){hClose();return}
 HARM=Date.now()+2200;toast('اضغط رجوع مرة ثانية للخروج',2000);
});

function locGate(msg){
 const g=$('#locgate');
 const how=isIOS?'<p>على الآيفون: اضغط على <b>aA</b> بشريط العنوان ثم <b>إعدادات الموقع</b> ثم <b>الموقع</b> واختر <b>سماح</b>. وإذا بعده ما يشتغل: الإعدادات ثم الخصوصية والأمان ثم خدمات الموقع ثم Safari ثم اختر <b>أثناء استخدام التطبيق</b>.</p>':'<p>إذا رفضت الإذن سابقاً: اضغط على القفل بشريط العنوان ثم الموقع ثم سماح، وارجع اضغط إعادة المحاولة.</p>';

 g.classList.add('on');$('#lgr').onclick=()=>askLocation();
}
function askLocation(first){
 if(!navigator.geolocation){$('#locgate').classList.remove('on');return}
 if(first&&!$('#locgate').classList.contains('on'))locGate('اضغط <b>سماح</b> عند ظهور سؤال الموقع حتى يفتح التطبيق.');
 const ok=p=>{locFails=0;S.loc={lat:p.coords.latitude,lng:p.coords.longitude};$('#locgate').classList.remove('on')};
 navigator.geolocation.getCurrentPosition(ok,e=>{
  if(e.code===1){locFails++;locGate('يحتاج طباخكم الوصول لموقعك لتحديد منطقتك وتوصيل الخدمات.')}
  else navigator.geolocation.getCurrentPosition(ok,()=>{$('#locgate').classList.remove('on')},{enableHighAccuracy:false,timeout:15000,maximumAge:600000});
 },{enableHighAccuracy:false,timeout:15000,maximumAge:600000});
}
if(!window._locVis){window._locVis=1;document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$('#locgate').classList.contains('on'))askLocation()});try{navigator.permissions&&navigator.permissions.query({name:'geolocation'}).then(r=>{r.onchange=()=>{if(r.state==='granted'&&$('#locgate').classList.contains('on'))askLocation()}}).catch(()=>{})}catch(e){}}

}
