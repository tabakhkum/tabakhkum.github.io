<style>

.cap .tg{color:#fbbf24;font-weight:700}

.ab.sv.on .ic{fill:#fbbf24;stroke:#fbbf24}

.pbio{margin:8px auto 0;max-width:320px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}

.sbg.full{align-items:stretch;background:#0b1220}

.nhd{display:flex;align-items:center;gap:10px;margin-bottom:10px}.nhd button{padding:6px}.nhd h3{margin:0}

.bd{flex:1;overflow-y:auto;padding:14px 14px 140px}
.btn{display:block;width:100%;padding:13px;border-radius:12px;background:var(--gold);color:#fff;font-weight:700;font-size:16px;margin-top:14px;text-align:center}

.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px}
.mu{color:var(--mu);font-size:13px}

.big{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 12px;text-align:center;font-size:17px;font-weight:700}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none;flex:none}

.tab{padding:8px 14px;border-radius:20px;background:var(--card);white-space:nowrap;font-size:14px}

.pstat{display:flex;justify-content:space-around;text-align:center;margin:12px 0}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}

.pbar i{display:block;height:100%;background:var(--gold2)}
.rec{position:absolute;inset:0;z-index:90;background:#000;display:flex;flex-direction:column}
.rec video{flex:1;min-height:0;width:100%;object-fit:cover}
.rec .ctl{display:flex;justify-content:space-around;align-items:center;padding:16px 10px calc(16px + env(safe-area-inset-bottom));background:#000}
.rec .shot{width:68px;height:68px;border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center}
.rec .shot i{display:block;width:46px;height:46px;border-radius:50%;background:var(--bad)}

.rec .tm{position:absolute;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#000a;padding:4px 12px;border-radius:12px;font-weight:700}
.admt{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;flex:none;border-bottom:1px solid var(--line);scrollbar-width:none}
.admt::-webkit-scrollbar{display:none}
.oc .l{font-size:13px;color:var(--mu);line-height:1.8}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
.perm{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px}
.empty{padding:50px 20px;text-align:center;color:var(--mu)}
</style>

function imgBlob(file,max){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('img')),'image/jpeg',.85)};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};im.src=u})}

const em=u=>[...new TextEncoder().encode(u.trim().toLowerCase())].map(b=>b.toString(16).padStart(2,'0')).join('')+'@tabakhkum.app';
function requireAuth(cb){if(S.user&&S.me){cb();return}authSheet(cb,'login')}
function authSheet(cb,mode){
 const reg=mode==='reg';
 const s=sheet(`<h3>${t(reg?'register':'login')}</h3>
  <label>${t('username')}</label><input id="au" maxlength="14" autocomplete="username">
  ${reg?`<label>${t('phone')}</label><input id="ap" type="tel" inputmode="tel" placeholder="07xxxxxxxxx">`:''}
  <label>${t('password')}</label><input id="aw" type="password" autocomplete="${reg?'new-password':'current-password'}">
  <button class="btn" id="ago">${t(reg?'register':'login')}</button>
  <button class="lnk" id="asw">${t(reg?'hasacc':'noacc')}</button>`);
 s.querySelector('#asw').onclick=()=>{s.close();authSheet(cb,reg?'login':'reg')};
 s.querySelector('#ago').onclick=async ev=>{
  const u=s.querySelector('#au').value.trim(),w=s.querySelector('#aw').value,ph=reg?s.querySelector('#ap').value:'';
  if(u.length<2||u.length>14)return toast(t('baduser'));
  if(w.length<6)return toast(t('shortpw'));
  if(reg&&norm(ph).length<10)return toast(t('badphone'));
  ev.target.disabled=true;
  try{
   if(reg){
    const ex=await Q(sb.rpc('login_email',{p_name:u}));
    if(ex)throw new Error(t('dup'));
    const {data,error}=await sb.auth.signUp({email:em(u),password:w});
    if(error){if(/registered|exists/i.test(error.message||''))throw new Error(t('dup'));throw error}
    if(!data.session)throw new Error(t('confirmoff'));
    await Q(sb.from('profiles').insert({id:data.user.id,username:u}));
    await Q(sb.rpc('register_private',{p_phone:ph}));
   }else{
    let email=em(u);try{const lr=await sb.rpc('login_email',{p_name:u});if(lr.data)email=lr.data}catch(e){}
    const {error}=await sb.auth.signInWithPassword({email,password:w});
    if(error)throw new Error(t('badlogin'));
   }
   s.close();await loadMe();toast(S.me?S.me.username:'');
   checkRating();cb&&cb();
  }catch(e){toast(errMsg(e))}finally{ev.target.disabled=false}
 };
}

const F={mode:'all',tag:null,tok:0,off:0,busy:false,end:false,seen:new Set(),sound:true,cur:null,viewed:new Set()};
let RID=(()=>{try{const r=new URLSearchParams(location.search).get('r');return /^[0-9a-f-]{36}$/i.test(r||'')?r:null}catch(e){return null}})();
const io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting)activate(en.target);else{const v=en.target.querySelector('video');v&&v.pause()}})},{root:$('#feed'),threshold:.65});
function hideTag(){F.tag=null;$('#tagbar').style.display='none'}
async function openTag(tag){
 F.tag=tag;F.mode='all';setTabs();if(S.screen!=='feed')go('feed');
 const tb=$('#tagbar');tb.style.display='flex';tb.innerHTML=`<b>#${esc(tag)}</b><span class="mu" id="tgs"></span><button id="tgx">${ic('x')}</button>`;
 $('#tgx').onclick=()=>{hideTag();reloadFeed()};
 reloadFeed();
 try{const r=await Q(sb.rpc('hashtag_stats',{p_tag:tag}));const x=r[0]||{videos:0,users:0};if(F.tag===tag&&$('#tgs'))$('#tgs').textContent=x.videos+' فيديو، '+x.users+' مستخدم'}catch(e){}
}
function showReel(id){RID=id;hideTag();F.mode='all';setTabs();go('feed');reloadFeed()}
function reloadFeed(){F.tok++;F.busy=false;F.off=0;F.end=false;F.seen=new Set();F.cur=null;$('#feed').innerHTML='';loadMore(true)}
async function loadMore(first){
 if(F.busy||F.end)return;F.busy=true;const tok=F.tok,fr=F.mode==='fr';
 try{
  let rows=[];
  if(first&&RID&&!fr&&!F.tag){const r=await sb.rpc('feed',{p_offset:0,p_limit:1,p_id:RID});rows=r.data||[];RID=null}
  let d=[],tries=0;const lim=fr?30:8;
  while(true){
   const x=await Q(sb.rpc('feed',F.tag?{p_offset:F.off,p_limit:lim,p_tag:F.tag}:{p_offset:F.off,p_limit:lim}));
   if(tok!==F.tok)return;
   F.off+=x.length;if(x.length<lim)F.end=true;
   d=d.concat(fr?x.filter(r=>r.following||r.reposted_by):x);
   if(d.length>=1||F.end||!fr||++tries>4)break;
  }
  rows=rows.concat(d).filter(x=>!F.seen.has(x.id));
  rows.forEach(x=>{F.seen.add(x.id);addSlide(x)});
  if(!$('#feed').children.length)$('#feed').innerHTML=`<div class="empty" style="padding-top:40dvh">${t(fr?'nofr':'nofeed')}</div>`;
 }catch(e){
  if(tok!==F.tok)return;
  if(!$('#feed').querySelector('.slide'))$('#feed').innerHTML=`<div class="empty" style="padding-top:40dvh">${esc(errMsg(e))}<br><button class="btn sm" id="rtry">${t('retry')}</button></div>`,$('#rtry').onclick=()=>{$('#feed').innerHTML='';loadMore(true)};
 }
 F.busy=false;
}
function repLabel(r){return r.reposted?ic('repeat')+'أعدت نشره':(r.reposted_by?ic('repeat')+'أعاد نشره @'+esc(r.reposted_by):'')}
function visBadge(r){const mine=S.user&&S.user.id===r.user_id;return mine&&r.visibility&&r.visibility!=='public'?`<span class="vsb">${r.visibility==='friends'?'أصدقاء':'خاص'}</span>`:''}
function fmtCap(c){return esc(c).replace(/(^|\s)(#[\p{L}\p{N}_]+)/gu,'$1<span class="tg" data-tag="$2">$2</span>')}
function fmtAgo(d){if(!d)return '';const x=new Date(d),m=(Date.now()-x)/6e4;
 if(m<1)return 'الآن';if(m<60)return 'قبل '+Math.floor(m)+' دقيقة';if(m<1440)return 'قبل '+Math.floor(m/60)+' ساعة';
 return x.toLocaleDateString('ar-IQ',{day:'numeric',month:'long',year:'numeric'})}
function slideHtml(r){
 const ini=esc((r.username||'?').slice(0,1));
 const mine=S.user&&S.user.id===r.user_id;
 return `<div class="vwrap"><video playsinline loop muted preload="none" data-src="${esc(r.video_url)}"></video><div class="heart">${ic('heart')}</div></div>
 <div class="bar"><i></i></div>
 <div class="acts">
  <div class="av" data-act="prof">${r.avatar_url?`<img src="${esc(r.avatar_url)}" alt="">`:ini}${(!mine&&!r.following)?`<span class="fol" data-act="fol">${ic('plus')}</span>`:''}</div>
  <button class="ab${r.liked?' on':''}" data-act="like">${ic('heart')}<span class="n">${r.likes}</span></button>
  <button class="ab" data-act="cm">${ic('comment')}<span class="n">${r.comments}</span></button>
  <button class="ab sv${r.saved?' on':''}" data-act="save">${ic('bookmark')}<span>حفظ</span></button>
  <button class="ab" data-act="share">${ic('share')}<span class="n">${r.shares||''}</span></button>
  ${sv('show_book_btn','0')==='1'?`<button class="ab" data-act="book">${ic('book')}<span>${t('book')}</span></button>`:''}
  <div class="disc"><i>${r.avatar_url?`<img src="${esc(r.avatar_url)}" alt="">`:ini}</i></div>
 </div>
 <div class="cap"><div class="rpb">${repLabel(r)}</div><div><b data-act="prof">@${esc(r.username)}</b><span class="dt">${fmtAgo(r.created_at)}</span>${visBadge(r)}</div>${r.caption?`<div class="ct">${fmtCap(r.caption)}</div>${(r.caption.length>70||r.caption.includes('\n'))?`<button class="more" data-act="more">عرض المزيد</button>`:''}`:''}</div>`;
}
function addSlide(r){
 const el=document.createElement('section');el.className='slide';el.dataset.id=r.id;el.dataset.uid=r.user_id;el.innerHTML=slideHtml(r);
 el._r=r;
 const v=el.querySelector('video');
 v.addEventListener('timeupdate',()=>{const b=el.querySelector('.bar i');if(b&&v.duration)b.style.width=(v.currentTime/v.duration*100)+'%'});
 $('#feed').appendChild(el);io.observe(el);
}
function setSrc(sl,pre){const v=sl&&sl.querySelector('video');if(!v)return;if(!v.getAttribute('src')&&v.dataset.src)v.src=v.dataset.src;v.preload=pre}
function unload(sl){const v=sl&&sl.querySelector('video');if(v&&v.getAttribute('src')){v.pause();v.removeAttribute('src');v.load()}}
function activate(el){
 F.cur=el;
 const all=[...$('#feed').querySelectorAll('.slide')],i=all.indexOf(el);
 all.forEach((s,j)=>{if(j===i)setSrc(s,'auto');else if(j===i+1)setSrc(s,'auto');else if(j===i-1)setSrc(s,'metadata');else unload(s)});
 playCur();
 if(i>=all.length-3)loadMore();
 const id=el.dataset.id;
 if(!F.viewed.has(id)){F.viewed.add(id);setTimeout(()=>{if(F.cur===el)sb.rpc('add_view',{p_reel:id}).then(()=>{})},1500)}
}
function playCur(){
 if(!F.cur||S.screen!=='feed')return;
 const v=F.cur.querySelector('video');if(!v)return;
 v.muted=!F.sound;
 const p=v.play();if(p&&p.catch)p.catch(()=>{v.muted=true;F.sound=false;syncSnd();v.play().catch(()=>{})});
}
function pauseAll(){document.querySelectorAll('#feed video').forEach(v=>v.pause())}
function resumeCur(){playCur()}
function syncSnd(){document.querySelectorAll('#feed [data-act=snd]').forEach(b=>b.innerHTML=ic(F.sound?'son':'soff'))}
let lastTap=0,tapTm=null;
$('#feed').addEventListener('click',e=>{
 const sl=e.target.closest('.slide');if(!sl)return;
 const tg=e.target.closest('[data-tag]');if(tg){openTag(tg.dataset.tag.slice(1));return}
 const b=e.target.closest('[data-act]');
 if(b){reelAct(b.dataset.act,sl,b);return}
 if(!e.target.closest('.vwrap'))return;
 const now=Date.now();
 if(now-lastTap<320){clearTimeout(tapTm);lastTap=0;likeReel(sl,true);const h=sl.querySelector('.heart');h.classList.remove('go');void h.offsetWidth;h.classList.add('go');return}
 lastTap=now;
 tapTm=setTimeout(()=>{const v=sl.querySelector('video');if(v.paused)v.play().catch(()=>{});else v.pause()},320);
});
document.addEventListener('pointerup',()=>{if(S.screen==='feed'&&!F.sound){F.sound=true;const v=F.cur&&F.cur.querySelector('video');if(v)v.muted=false}},true);
function reelAct(a,sl,btn){
 const r=sl._r;
 if(a==='more'){const c=sl.querySelector('.cap');const o=c.classList.toggle('open');btn.textContent=o?'عرض أقل':'عرض المزيد';return}
 if(a==='snd'){F.sound=!F.sound;const v=sl.querySelector('video');v.muted=!F.sound;if(v.paused)v.play().catch(()=>{});syncSnd()}
 else if(a==='like')likeReel(sl,false);
 else if(a==='save')requireAuth(async()=>{const add=!r.saved;r.saved=add;btn.classList.toggle('on',add);
  try{if(add)await Q(sb.from('saves').insert({reel_id:r.id,user_id:S.user.id}));else await Q(sb.from('saves').delete().eq('reel_id',r.id).eq('user_id',S.user.id));toast(add?'تم الحفظ، تلكاه ببروفايلك':'تم إلغاء الحفظ')}
  catch(e){r.saved=!add;btn.classList.toggle('on',!add);toast(errMsg(e))}});
 else if(a==='cm')commentsSheet(sl);
 else if(a==='share')shareReel(sl);
 else if(a==='book'){S.step='occ';renderFlow();go('flow')}
 else if(a==='prof')openProfile(r.user_id);
 else if(a==='fol')requireAuth(async()=>{try{await Q(sb.from('follows').insert({follower_id:S.user.id,followee_id:r.user_id}));document.querySelectorAll(`.slide[data-uid="${r.user_id}"] .fol`).forEach(x=>x.remove());document.querySelectorAll('.slide').forEach(s=>{if(s._r&&s._r.user_id===r.user_id)s._r.following=true})}catch(e){toast(errMsg(e))}});
}
function likeReel(sl,onlyAdd){
 requireAuth(async()=>{
  const r=sl._r,btn=sl.querySelector('[data-act=like]'),n=btn.querySelector('.n');
  if(onlyAdd&&r.liked)return;
  const add=!r.liked;r.liked=add;r.likes+=add?1:-1;btn.classList.toggle('on',add);n.textContent=r.likes;
  try{
   if(add)await Q(sb.from('likes').insert({reel_id:r.id,user_id:S.user.id}));
   else await Q(sb.from('likes').delete().eq('reel_id',r.id).eq('user_id',S.user.id));
  }catch(e){r.liked=!add;r.likes+=add?-1:1;btn.classList.toggle('on',!add);n.textContent=r.likes;toast(errMsg(e))}
 });
}
async function shareReel(sl){
 const r=sl._r,url=location.origin+location.pathname+'?r='+r.id,txt=(r.caption||'طباخكم').slice(0,90),own=S.user&&S.user.id===r.user_id;
 const count=()=>sb.rpc('add_share',{p_reel:r.id}).then(()=>{r.shares=(r.shares||0)+1;const n=sl.querySelector('[data-act=share] .n');if(n)n.textContent=r.shares});
 const VL={public:'عام',friends:'الأصدقاء',private:'خاص'};
 const vis=()=>['public','friends','private'].map(k=>`<button class="btn sm${(r.visibility||'public')===k?'':' sec'}" data-vis="${k}">${VL[k]}</button>`).join('');
 const sh=sheet(`<h3>مشاركة</h3>
  ${own?'':`<button class="btn sec" data-s="rp">${r.reposted?'إلغاء إعادة النشر':'إعادة نشر'}</button>`}
  <button class="btn sec" data-s="wa">واتساب</button>
  <button class="btn sec" data-s="tg">تيليجرام</button>
  <button class="btn sec" data-s="cp">نسخ الرابط</button>
  ${navigator.share?'<button class="btn sec" data-s="more">تطبيقات أخرى</button>':''}
  ${own?`<h3 style="margin-top:18px">من يشاهد هذا المنشور؟</h3><div id="vb">${vis()}</div><div class="mu" style="margin-top:6px">عام: الكل. الأصدقاء: اللي تتابعهم ويتابعوك. خاص: أنت بس.</div>`:''}`);
 sh.onclick=async e=>{
  const v=e.target.closest('[data-vis]');
  if(v){try{await Q(sb.rpc('set_visibility',{p_reel:r.id,p_vis:v.dataset.vis}));r.visibility=v.dataset.vis;sh.querySelector('#vb').innerHTML=vis();
    const d=sl.querySelector('.cap .dt');const old=sl.querySelector('.cap .vsb');if(old)old.remove();if(d)d.insertAdjacentHTML('afterend',visBadge(r));toast('تم تغيير الخصوصية')}catch(x){toast(errMsg(x))}return}
  const b=e.target.closest('[data-s]');if(!b)return;const k=b.dataset.s;
  if(k==='rp'){sh.close();requireAuth(async()=>{const add=!r.reposted;try{
    if(add)await Q(sb.from('reposts').insert({reel_id:r.id,user_id:S.user.id}));else await Q(sb.from('reposts').delete().eq('reel_id',r.id).eq('user_id',S.user.id));
    r.reposted=add;const l=sl.querySelector('.rpb');if(l)l.innerHTML=repLabel(r);toast(add?'تمت إعادة النشر لمتابعيك':'تم إلغاء إعادة النشر')}catch(x){toast(errMsg(x))}});return}
  if(k==='wa')window.open('https://wa.me/?text='+encodeURIComponent(txt+'\n'+url),'_blank');
  else if(k==='tg')window.open('https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent(txt),'_blank');
  else if(k==='cp'){try{await navigator.clipboard.writeText(url);toast('تم نسخ الرابط')}catch(x){toast(url)}}
  else{try{await navigator.share({title:'طباخكم',text:txt,url})}catch(x){return}}
  sh.close();count()};
}
async function commentsSheet(sl){
 const r=sl._r;
 const s=sheet(`<h3>${t('comments')}</h3><div id="cl" style="height:52dvh;overflow-y:auto"></div>
  <div class="row" style="margin-top:10px"><input id="ci" maxlength="300" placeholder="${t('addcomment')}"><button class="btn sm" id="cs" style="flex:none;margin:0">${t('send')}</button></div>`);
 const list=async()=>{try{
  const d=await Q(sb.from('comments').select('id,body,user_id,created_at,profiles(username)').eq('reel_id',r.id).order('created_at',{ascending:false}).limit(100));
  s.querySelector('#cl').innerHTML=d.length?d.map(c=>`<div class="cm"><div class="cav">${esc(((c.profiles&&c.profiles.username)||'?').slice(0,1))}</div><div style="flex:1"><b>${esc(c.profiles&&c.profiles.username)}</b><span class="ctm">${fmtAgo(c.created_at)}</span><div>${esc(c.body)}</div></div>${(S.user&&(c.user_id===S.user.id||can('reels')))?`<button data-del="${c.id}" class="mu">${ic('x')}</button>`:''}</div>`).join(''):`<div class="empty">${t('no_comments')}</div>`;
  const n=sl.querySelector('[data-act=cm] .n');r.comments=d.length;if(n)n.textContent=d.length;
 }catch(e){toast(errMsg(e))}};
 s.querySelector('#cl').onclick=async e=>{const b=e.target.closest('[data-del]');if(!b)return;try{await Q(sb.from('comments').delete().eq('id',b.dataset.del));list()}catch(x){toast(errMsg(x))}};
 s.querySelector('#cs').onclick=()=>requireAuth(async()=>{const i=s.querySelector('#ci'),v=i.value.trim();if(!v)return;try{await Q(sb.from('comments').insert({reel_id:r.id,user_id:S.user.id,body:v}));i.value='';list()}catch(e){toast(errMsg(e))}});
 list();
}

/* ================= الملف الشخصي والنشر ================= */
function pickAvatar(done){
 const i=document.createElement('input');i.type='file';i.accept='image/*';
 i.onchange=async()=>{try{const f=i.files[0];if(!f)return;const b=await imgBlob(f,512),path=S.user.id+'/a_'+Date.now()+'.jpg';
  await Q(sb.storage.from('avatars').upload(path,b,{contentType:'image/jpeg'}));
  const u=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
  await Q(sb.from('profiles').update({avatar_url:u}).eq('id',S.user.id));await loadMe();done(u)}catch(e){toast(errMsg(e))}};
 i.click();
}
function editProfile(p,after){
 const chk=(id,on,txt)=>`<label style="display:flex;gap:10px;align-items:center;margin:10px 0;color:var(--tx);font-size:15px"><input type="checkbox" id="${id}" ${on?'checked':''} style="width:22px;height:22px;flex:none"><span>${txt}</span></label>`;
 const s=sheet(`<h3>تعديل الملف الشخصي</h3>
  <div style="text-align:center"><div class="av" id="eav" style="width:84px;height:84px;font-size:34px;margin:0 auto">${p.avatar_url?`<img src="${esc(p.avatar_url)}" alt="">`:esc((p.username||'?').slice(0,1))}</div><button class="lnk" id="echg">تغيير الصورة</button></div>
  <label>اسم المستخدم</label><input id="en" maxlength="14" value="${esc(p.username)}">
  <label>نبذة عنك</label><textarea id="eb" maxlength="150" rows="3" placeholder="اكتب نبذة قصيرة">${esc(p.bio||'')}</textarea><div class="mu" id="ebc" style="text-align:left"></div>
  <label>الخصوصية</label>
  ${chk('epl',p.show_likes,'يظهر للجميع المنشورات اللي أعجبتني')}
  ${chk('epf',p.show_follows,'تظهر للجميع قائمة المتابعين والمتابَعين')}
  ${chk('epr',p.show_reposts,'تظهر للجميع المنشورات اللي أعدت نشرها')}
  <button class="btn" id="esv">حفظ</button>`);
 const cnt=()=>s.querySelector('#ebc').textContent=s.querySelector('#eb').value.length+'/150';cnt();s.querySelector('#eb').oninput=cnt;
 s.querySelector('#echg').onclick=()=>pickAvatar(u=>{const a=s.querySelector('#eav');a.innerHTML=`<img src="${esc(u)}" alt="">`;p.avatar_url=u});
 s.querySelector('#esv').onclick=async ev=>{
  const nm=s.querySelector('#en').value.trim();ev.target.disabled=true;
  try{
   if(nm!==p.username){if(nm.length<2||nm.length>14)throw new Error(t('baduser'));await Q(sb.rpc('rename_user',{p_name:nm}))}
   await Q(sb.from('profiles').update({bio:s.querySelector('#eb').value.trim(),show_likes:s.querySelector('#epl').checked,show_follows:s.querySelector('#epf').checked,show_reposts:s.querySelector('#epr').checked}).eq('id',S.user.id));
   await loadMe();s.close();toast('تم حفظ التعديلات');after()
  }catch(e){toast(errMsg(e))}finally{ev.target.disabled=false}
 };
}
async function followListSheet(uid,kind,p,own){
 if(!own&&!p.show_follows)return toast('هذي القائمة خاصة');
 const s=sheet(`<h3>${kind==='followers'?t('followers'):t('followings')}</h3><div id="fl" style="max-height:60dvh;overflow-y:auto"><div class="empty">...</div></div>`);
 try{
  const d=await Q(sb.rpc('follow_list',{p_uid:uid,p_kind:kind}));
  s.querySelector('#fl').innerHTML=d.length?d.map(x=>`<div class="frow" data-u="${x.id}"><div class="cav">${x.avatar_url?`<img src="${esc(x.avatar_url)}" alt="">`:esc((x.username||'?').slice(0,1))}</div><b style="flex:1">@${esc(x.username)}</b></div>`).join(''):`<div class="empty">لا يوجد أحد بعد</div>`;

async function openProfile(uid,tab0){
 go('prof');const box=$('#prof');box.innerHTML=`<div class="hd"><button id="pb">${ic('back')}</button><b>${t('profile')}</b></div><div class="bd" id="pbd"><div class="empty">...</div></div>`;
 $('#pb').onclick=()=>go('feed');
 const own=S.user&&S.user.id===uid;
 try{
  const [p,st,isf]=await Promise.all([
   Q(sb.from('profiles').select('id,username,avatar_url,bio,show_likes,show_follows,show_reposts').eq('id',uid).single()),
   Q(sb.rpc('profile_stats',{p_uid:uid})),
   S.user&&!own?sb.from('follows').select('follower_id').eq('follower_id',S.user.id).eq('followee_id',uid).maybeSingle():Promise.resolve({data:null})]);
  const x=st[0]||{followers:0,following:0,reels:0,hearts:0};
  let score=0,goal=Number(sv('goal',200)),pct=Number(sv('pct',10)),rws=[];
  if(own){try{score=await Q(sb.rpc('my_score'));rws=await Q(sb.from('rewards').select('*').eq('user_id',uid).order('created_at'))}catch(e){}}
  const ini=esc((p.username||'?').slice(0,1));
  let h=`<div style="text-align:center"><div class="av" id="pav" style="width:84px;height:84px;font-size:34px;margin:0 auto">${p.avatar_url?`<img src="${esc(p.avatar_url)}" alt="">`:ini}</div>
   <h3 style="margin-top:8px">@${esc(p.username)}</h3>${p.bio?`<div class="pbio">${esc(p.bio)}</div>`:''}</div>
   <div class="pstat"><div class="lk" data-fl="followers"><b>${x.followers}</b><span class="mu">${t('followers')}</span></div><div class="lk" data-fl="following"><b>${x.following}</b><span class="mu">${t('followings')}</span></div><div><b>${x.reels}</b><span class="mu">${t('reelsn')}</span></div><div><b>${x.hearts}</b><span class="mu">إعجابات</span></div></div>`;
  if(!own&&S.user!==undefined)h+=`<button class="btn" id="pfol">${isf.data?t('following'):t('follow')}</button>`;
  if(own){
   const earned=Math.floor(score/Math.max(goal,1)),pend=rws.filter(y=>!y.approved).length,ok=rws.filter(y=>y.approved&&!y.used).length;
   h+=`<button class="btn sec" id="pedit">${ic('edit')} تعديل الملف الشخصي</button>
    <div class="card" style="margin-top:14px"><b>${t('reward')}</b><div class="pbar"><i style="width:${Math.min(100,(score%Math.max(goal,1))/Math.max(goal,1)*100)}%"></i></div>
    <div class="mu">${score} ${t('reward_t')} — ${goal} = ${pct}%</div>
    ${earned>rws.length?`<button class="btn sm" id="pclaim">${t('claim')}</button>`:''}
    ${pend?`<div class="mu" style="margin-top:6px">${t('reward_p')}</div>`:''}${ok?`<div style="color:var(--ok);margin-top:6px">${t('reward_ok')}</div>`:''}</div>`;
   if(sv('wa_verify_on','0')==='1'){
    h+=`<div class="card"><b>${S.priv&&S.priv.phone_verified?t('verified'):t('verify')}</b>${S.priv&&S.priv.phone_verified?'':`<button class="btn sm" id="pver">${t('verify_go')}</button>`}</div>`;
   }
   h+=`<button class="btn" id="ppub">${t('publish')}</button><button class="btn sec" id="pord">${t('my_orders')}</button><button class="btn sec" id="plog">${t('logout')}</button>`;
  }
  const TABS=[['reels','المنشورات'],['reposts','إعادة النشر'],['likes','الإعجابات']].concat(own?[['saved','المحفوظات']]:[]);
  h+=`<div class="ptabs" id="ptabs">${TABS.map(k=>`<button data-pt="${k[0]}">${k[1]}</button>`).join('')}</div><div id="ptc" style="margin-top:10px"></div>`;
  const bd=$('#pbd');bd.innerHTML=h;
  const tiles=(rows,del)=>rows.length?`<div class="tiles">${rows.map(y=>`<div class="tile" data-v="${esc(y.video_url)}"><video src="${esc(y.video_url)}#t=0.5" preload="metadata" muted playsinline></video><span>${y.views||0}</span>${y.hidden?'<b class="hid">مخفي</b>':(y.visibility&&y.visibility!=='public'?`<b class="hid" style="background:#475569">${y.visibility==='friends'?'أصدقاء':'خاص'}</b>`:'')}${del?`<button class="x" data-d="${y.id}" data-u="${esc(y.video_url)}">${ic('x')}</button>`:''}</div>`).join('')}</div>`:`<div class="empty">لا يوجد شي هنا بعد</div>`;
  const locked=`<div class="empty">${ic('lock')}<div style="margin-top:6px">هذي القائمة خاصة</div></div>`;
  const loadTab=async k=>{
   bd.querySelectorAll('#ptabs button').forEach(b=>b.classList.toggle('on',b.dataset.pt===k));
   const c=$('#ptc');c.innerHTML='<div class="empty">...</div>';
   try{
    if(k==='reels')c.innerHTML=tiles(await Q(sb.from('reels').select('id,video_url,views,hidden,caption,visibility').eq('user_id',uid).order('created_at',{ascending:false})),own);
    else if(k==='reposts')c.innerHTML=(!own&&!p.show_reposts)?locked:tiles(await Q(sb.rpc('profile_reposts',{p_uid:uid})),false);
    else if(k==='likes')c.innerHTML=(!own&&!p.show_likes)?locked:tiles(await Q(sb.rpc('profile_likes',{p_uid:uid})),false);
    else c.innerHTML=tiles(await Q(sb.rpc('my_saves')),false);
   }catch(e){c.innerHTML=`<div class="empty">${esc(errMsg(e))}</div>`}
  };
  bd.onclick=async e=>{
   const pt=e.target.closest('[data-pt]');if(pt){loadTab(pt.dataset.pt);return}
   const fl=e.target.closest('[data-fl]');if(fl){followListSheet(uid,fl.dataset.fl,p,own);return}
   const d=e.target.closest('[data-d]');
   if(d){e.stopPropagation();if(!confirm(t('sure')))return;try{await Q(sb.from('reels').delete().eq('id',d.dataset.d));const m=d.dataset.u.split('/reels/')[1];if(m)await sb.storage.from('reels').remove([decodeURIComponent(m.split('?')[0])]);openProfile(uid);reloadFeed()}catch(y){toast(errMsg(y))}return}
   const tl=e.target.closest('[data-v]');if(tl){sheet(`<video src="${tl.dataset.v}" controls autoplay playsinline style="width:100%;max-height:70dvh;border-radius:12px;background:#000"></video>`,()=>{});return}
  };
  loadTab(tab0||'reels');
  if(own){
   $('#pav').onclick=()=>pickAvatar(()=>openProfile(uid));
   $('#pedit').onclick=()=>editProfile(p,()=>openProfile(uid));
   const cl=$('#pclaim');if(cl)cl.onclick=async()=>{try{await Q(sb.rpc('claim_reward'));openProfile(uid)}catch(e){toast(errMsg(e))}};
   $('#ppub').onclick=publishSheet;$('#pord').onclick=openOrders;$('#plog').onclick=logout;
   const pv=$('#pver');if(pv)pv.onclick=startVerify;
  }else{
   const pf=$('#pfol');if(pf)pf.onclick=()=>requireAuth(async()=>{try{if(pf.textContent===t('following')){await Q(sb.from('follows').delete().eq('follower_id',S.user.id).eq('followee_id',uid))}else await Q(sb.from('follows').insert({follower_id:S.user.id,followee_id:uid}));openProfile(uid)}catch(e){toast(errMsg(e))}});
  }
 }catch(e){$('#pbd').innerHTML=`<div class="empty">${esc(errMsg(e))}</div>`}
}
async function startVerify(){
 try{
  const c=await Q(sb.rpc('start_wa_verify'));
  const num=sv('wa_verify',sv('wa','9647700000000'));
  window.open('https://wa.me/'+num+'?text='+encodeURIComponent('رمز التوثيق: '+c),'_blank');

  let n=0;const iv=setInterval(async()=>{n++;await loadMe();if((S.priv&&S.priv.phone_verified)||n>40){clearInterval(iv);if(S.priv&&S.priv.phone_verified){toast(t('verified'));openProfile(S.user.id)}}},4000);
 }catch(e){toast(errMsg(e))}

function publishSheet(){
 let pu=null;const rv=()=>{if(pu){try{URL.revokeObjectURL(pu)}catch(e){}pu=null}};
 const s=sheet(`<h3>${t('publish')}</h3>
  <button class="btn" id="prc">${t('record')}</button><button class="btn sec" id="prg">${t('gallery')}</button>
  <div id="pbox"></div>`,rv);
 const fileStep=(blob,ext)=>{
  rv();const url=pu=URL.createObjectURL(blob);
  s.querySelector('#pbox').innerHTML=`<video src="${url}" controls playsinline style="width:100%;max-height:36dvh;margin-top:12px;border-radius:12px;background:#000"></video>
   <label>${t('caption')}</label><textarea id="pcap" maxlength="200" rows="2" placeholder="اكتب وصف وهاشتاك مثل #طباخكم"></textarea>
   <label>من يشاهد المنشور؟</label><select id="pvis"><option value="public">عام</option><option value="friends">الأصدقاء فقط</option><option value="private">خاص (أنا فقط)</option></select><button class="btn" id="pgo">${t('upload')}</button>`;
  s.querySelector('#pgo').onclick=async ev=>{
   ev.target.disabled=true;ev.target.textContent=t('uploading');
   try{
    const path=S.user.id+'/'+Date.now()+'.'+ext;
    await Q(sb.storage.from('reels').upload(path,blob,{contentType:blob.type||('video/'+ext)}));
    const u=sb.storage.from('reels').getPublicUrl(path).data.publicUrl;
    await Q(sb.from('reels').insert({user_id:S.user.id,caption:s.querySelector('#pcap').value.trim(),video_url:u,visibility:s.querySelector('#pvis').value}));
    s.close();toast('تم النشر');openProfile(S.user.id);reloadFeed();
   }catch(e){toast(errMsg(e))}finally{ev.target.disabled=false;ev.target.textContent=t('upload')}
  };
 };
 s.querySelector('#prg').onclick=()=>{
  const i=document.createElement('input');i.type='file';i.accept='video/*';
  i.onchange=()=>{const f=i.files[0];if(!f)return;
   if(f.size>40*1048576)return toast(t('bigvid'),4500);
   const v=document.createElement('video'),u=URL.createObjectURL(f);v.preload='metadata';
   v.onloadedmetadata=()=>{URL.revokeObjectURL(u);if(v.duration>91)return toast(t('longvid'),4500);fileStep(f,(f.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,'')||'mp4')};
   v.onerror=()=>fileStep(f,(f.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,'')||'mp4');
   v.src=u};
  i.click();
 };
 s.querySelector('#prc').onclick=()=>recorder((blob,ext)=>fileStep(blob,ext));
}
async function recorder(done){
 if(!(navigator.mediaDevices&&window.MediaRecorder))return toast(t('camerr'));
 let fm='user',stream=null,mr=null,chunks=[],tm=0,iv=null,recording=false;
 const box=document.createElement('div');box.className='rec';
 box.innerHTML=`<video autoplay muted playsinline></video><div class="tm">0:00 / 1:30</div><div class="ctl"><button id="rf">${ic('flip')}</button><button class="shot" id="rs"><i></i></button><button id="rx">${ic('x')}</button></div>`;
 $('#app').appendChild(box);
 const vid=box.querySelector('video');
 const open=async()=>{if(stream)stream.getTracks().forEach(x=>x.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:fm,width:{ideal:720},height:{ideal:1280}},audio:true});vid.srcObject=stream;vid.style.transform=fm==='user'?'scaleX(-1)':'none'};
 const end=()=>{clearInterval(iv);if(stream)stream.getTracks().forEach(x=>x.stop());box.remove()};
 try{await open()}catch(e){end();return toast(t('camerr'))}
 box.querySelector('#rx').onclick=()=>{try{if(mr&&mr.state!=='inactive'){mr.onstop=null;mr.stop()}}catch(e){}end()};
 box.querySelector('#rf').onclick=async()=>{if(recording)return;fm=fm==='user'?'environment':'user';try{await open()}catch(e){toast(t('camerr'))}};
 const stop=()=>{if(mr&&mr.state!=='inactive')mr.stop()};
 box.querySelector('#rs').onclick=ev=>{
  const b=ev.currentTarget;
  if(recording){stop();return}
  const types=['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'];
  const mt=types.find(x=>MediaRecorder.isTypeSupported(x))||'';
  try{mr=new MediaRecorder(stream,mt?{mimeType:mt,videoBitsPerSecond:1200000,audioBitsPerSecond:96000}:{videoBitsPerSecond:1200000})}catch(e){return toast(t('camerr'))}
  chunks=[];mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  mr.onstop=()=>{const type=mr.mimeType||mt||'video/webm';const blob=new Blob(chunks,{type});end();done(blob,type.includes('mp4')?'mp4':'webm')};
  mr.start(1000);recording=true;b.classList.add('on');tm=0;
  iv=setInterval(()=>{tm++;box.querySelector('.tm').textContent=Math.floor(tm/60)+':'+String(tm%60).padStart(2,'0')+' / 1:30';if(tm>=90)stop()},1000);
 };
}

const ST=['new','confirmed','provider_found','delivered','cancelled'];
const PERMS=[['orders','الطلبات'],['status','تغيير حالة الطلب'],['chat','الدردشة مع الزبائن'],['ratings','طلب تقييم المكالمة'],['items','الأيتمات والأسعار'],['reels','التحكم بالريلزات'],['providers','مقدمو الخدمات'],['profit','الأرباح والتقارير'],['settings','الإعدادات والمكافآت']];
const A={tab:null,filter:''};
function openAdmin(){
 pauseAll();S.screen='adm';
 ['feed','flow','prof'].forEach(x=>$('#'+x).classList.remove('on'));$('#adm').classList.add('on');$('#top').style.display='none';$('#fab').style.display='none';$('#cartbar').classList.remove('on');
 const tabs=[];

 if(can('items'))tabs.push(['itm','الأيتمات']);
 if(can('reels'))tabs.push(['rl','الريلزات']);
 if(can('providers'))tabs.push(['prv','مقدمو الخدمات']);
 if(can('profit'))tabs.push(['rep','الحسابات']);
 if(S.adm&&S.adm.role==='owner')tabs.push(['stf','الموظفون']);
 if(can('settings'))tabs.push(['set','الإعدادات']);
 $('#adm').innerHTML=`<div class="hd"><button id="ax">${ic('back')}</button><b>لوحة التحكم</b></div><div class="admt">${tabs.map(x=>`<button class="tab" data-t="${x[0]}">${x[1]}</button>`).join('')}</div><div class="bd" id="abd"></div>`;
 $('#ax').onclick=()=>{go('feed')};
 $('#adm .admt').onclick=e=>{const b=e.target.closest('[data-t]');if(b)admTab(b.dataset.t)};

function admTab(k){
 A.tab=k;document.querySelectorAll('#adm .admt .tab').forEach(b=>b.classList.toggle('on',b.dataset.t===k));
 const f={ord:admOrders,itm:admItems,rl:admReels,prv:admProviders,rep:admReport,stf:admStaff,set:admSettings}[k];
 $('#abd').innerHTML='<div class="empty">...</div>';f&&f();
}
const waLink=(p,txt)=>'https://wa.me/'+norm(p)+(txt?'?text='+encodeURIComponent(txt):'');
const fmtDT=d=>new Date(d).toLocaleString('ar-IQ',{dateStyle:'short',timeStyle:'short'});

 const box=$('#abd');

   المجموع: <b>${money(b.total)}</b>${b.discount>0?` (خصم ${b.discount}%)`:''}${pf[b.id]?` | الربح: <b style="color:var(--ok)">${money(pf[b.id].profit)}</b>`:''}

   S.items.filter(i=>i.category_id===c.id).forEach(i=>{
    h+=`<div class="it" style="${i.active?'':'opacity:.5'}"><div class="ph">${i.image_url?`<img src="${esc(i.image_url)}" alt="" onerror="this.remove()">`:esc(i.name.slice(0,1))}</div><div class="in"><div class="nm">${esc(i.name)}</div><div class="pr">${money(i.price)}${i.discount>0?` | خصم ${i.discount}%`:''} | ربح ${i.profit_pct}%</div></div>

   });

  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;

 };

 const s=sheet(`<h3>قسم جديد</h3><label>اسم القسم</label><input id="cn" maxlength="80"><label>يظهر في تبويب</label><select id="ct">${TABS.map(x=>`<option value="${x}">${t('tab_'+x)}</option>`).join('')}</select><button class="btn" id="cg">حفظ</button>`);

function itemForm(it,catId){
 const n=!it;it=it||{name:'',unit:'',price:0,discount:0,profit_pct:0,image_url:'',occasions:null,active:true,category_id:catId};
 const oc=it.occasions||[];
 const s=sheet(`<h3>${n?'أيتم جديد':'تعديل الأيتم'}</h3>
  <label>الاسم</label><input id="in" maxlength="80" value="${esc(it.name)}">
  <label>الوحدة (مثل: للكيلو، للقزان)</label><input id="iu" maxlength="40" value="${esc(it.unit)}">
  <div class="grid2"><div><label>السعر (0 = حسب الطلب)</label><input id="ip" type="number" inputmode="numeric" min="0" value="${it.price}"></div><div><label>الخصم %</label><input id="id" type="number" inputmode="numeric" min="0" max="100" value="${it.discount}"></div></div>
  <label>نسبة ربحك من الأيتم %</label><input id="ir" type="number" inputmode="numeric" min="0" max="100" value="${it.profit_pct}">
  <label>الصورة (رفع صورة أو رابط)</label><input id="if" type="file" accept="image/*"><input id="iurl" placeholder="https://..." value="${esc(it.image_url||'')}" style="margin-top:6px">
  <label>يظهر في المناسبات (بدون اختيار = كل المناسبات)</label>
  <div>${['engagement','wedding','mourning'].map(o=>`<label class="perm"><input type="checkbox" data-o="${o}" ${oc.includes(o)?'checked':''}> ${t(o)}</label>`).join('')}</div>
  <label class="perm"><input type="checkbox" id="ia" ${it.active?'checked':''}> ظاهر للزبائن</label>
  <button class="btn" id="ig">حفظ</button>`);
 s.querySelector('#ig').onclick=async ev=>{
  const g=id=>s.querySelector('#'+id).value.trim();
  if(!g('in'))return toast('اكتب الاسم');
  ev.target.disabled=true;
  try{
   let url=g('iurl')||null;const f=s.querySelector('#if').files[0];
   if(f){const b=await imgBlob(f,800),path='i_'+Date.now()+'.jpg';await Q(sb.storage.from('items').upload(path,b,{contentType:'image/jpeg'}));url=sb.storage.from('items').getPublicUrl(path).data.publicUrl}
   const occ=[...s.querySelectorAll('[data-o]:checked')].map(x=>x.dataset.o);
   const row={name:g('in'),unit:g('iu'),price:Math.max(0,Number(g('ip'))||0),discount:Math.min(100,Math.max(0,Number(g('id'))||0)),profit_pct:Math.min(100,Math.max(0,Number(g('ir'))||0)),image_url:url,occasions:occ.length?occ:null,active:s.querySelector('#ia').checked};
   if(n)await Q(sb.from('items').insert({...row,category_id:it.category_id,sort:S.items.length+1}));else await Q(sb.from('items').update(row).eq('id',it.id));
   s.close();admItems();
  }catch(e){toast(errMsg(e))}finally{ev.target.disabled=false}
 };
}
async function admReels(){
 const box=$('#abd');
 try{

   <div class="l">${esc(r.caption)||'بدون وصف'}<br>${r.pinned?'<b style="color:var(--gold2)">مثبّت</b> ':''}${r.hidden?'<b style="color:var(--bad)">مخفي</b> ':''}${r.boost>0?'<b style="color:var(--ok)">ترند ('+r.boost+')</b> ':''}${r.boost<0?'<b style="color:var(--bad)">انتشار مخفّض ('+r.boost+')</b>':''}</div>

   <button class="btn sm sec" data-x="pin">${r.pinned?'إلغاء التثبيت':'تثبيت'}</button>
   <button class="btn sm sec" data-x="up">ترند +</button><button class="btn sm sec" data-x="down">تقليل الانتشار</button><button class="btn sm sec" data-x="rst">تصفير</button>
   <button class="btn sm sec" data-x="hide">${r.hidden?'إظهار':'إخفاء'}</button><button class="btn sm bad" data-x="del">حذف</button><button class="btn sm bad" data-x="ban">حظر صاحبه</button></div>`).join(''):'<div class="empty">لا توجد ريلزات</div>';
  box.onclick=async e=>{
   const x=e.target.closest('[data-x]');if(!x)return;const c=x.closest('.oc'),id=c.dataset.id,b=Number(c.dataset.b),k=x.dataset.x;
   try{
    if(k==='pin'||k==='hide'){const cur=x.textContent;await Q(sb.from('reels').update(k==='pin'?{pinned:cur==='تثبيت'}:{hidden:cur==='إخفاء'}).eq('id',id))}
    else if(k==='up')await Q(sb.from('reels').update({boost:Math.max(b,0)+50}).eq('id',id));
    else if(k==='down')await Q(sb.from('reels').update({boost:Math.min(b,0)-100}).eq('id',id));
    else if(k==='rst')await Q(sb.from('reels').update({boost:0}).eq('id',id));

    else if(k==='ban'){if(!confirm('حظر صاحب الحساب من النشر والتعليق والطلب؟'))return;await Q(sb.rpc('set_banned',{p_user:c.dataset.u,p_banned:true}));toast('تم الحظر')}
    admReels();reloadFeed();
   }catch(er){toast(errMsg(er))}
  };
 }catch(e){box.innerHTML=`<div class="empty">${esc(errMsg(e))}</div>`}
}

async function admReport(){
 const box=$('#abd');
 const rng=k=>{const d=new Date(),to=today();let f=to;if(k==='7')f=new Date(d-6*864e5).toISOString().slice(0,10);if(k==='30')f=new Date(d-29*864e5).toISOString().slice(0,10);if(k==='all')f='2020-01-01';return[f,to]};
 box.innerHTML=`<div class="tabs"><button class="tab on" data-r="1">اليوم</button><button class="tab" data-r="7">7 أيام</button><button class="tab" data-r="30">30 يوماً</button><button class="tab" data-r="all">الكل</button></div><div id="rb"></div><button class="btn sec" id="rx">تصدير الطلبات المكتملة (Excel)</button>`;
 const show=async k=>{
  box.querySelectorAll('[data-r]').forEach(b=>b.classList.toggle('on',b.dataset.r===k));
  try{
   const [f,to]=rng(k),d=await Q(sb.rpc('report',{p_from:f,p_to:to}));
   const sum=d.reduce((a,x)=>({o:a.o+Number(x.orders),r:a.r+Number(x.revenue),p:a.p+Number(x.profit)}),{o:0,r:0,p:0});
   box.querySelector('#rb').innerHTML=`<div class="grid2"><div class="card"><div class="mu">الإيرادات</div><b style="font-size:18px">${money(sum.r)}</b></div><div class="card"><div class="mu">صافي الربح</div><b style="font-size:18px;color:var(--ok)">${money(sum.p)}</b></div></div><div class="mu">عدد الطلبات المكتملة: ${sum.o}</div>
   <table><tr><th>اليوم</th><th>طلبات</th><th>إيراد</th><th>ربح</th></tr>${d.map(x=>`<tr><td>${esc(x.day)}</td><td>${x.orders}</td><td>${money(x.revenue)}</td><td>${money(x.profit)}</td></tr>`).join('')}</table>`;
  }catch(e){box.querySelector('#rb').innerHTML=`<div class="empty">${esc(errMsg(e))}</div>`}
 };
 box.querySelector('.tabs').onclick=e=>{const b=e.target.closest('[data-r]');if(b)show(b.dataset.r)};
 box.querySelector('#rx').onclick=async()=>{
  try{
   const d=await Q(sb.from('bookings').select('*').eq('status','delivered').order('created_at',{ascending:false}).limit(1000));
   const pf={};(await Q(sb.from('booking_profit').select('*').in('booking_id',d.map(x=>x.id).slice(0,1000)))).forEach(x=>pf[x.booking_id]=x);
   const rows=[['رقم الطلب','تاريخ الطلب','الاسم','الهاتف','المناسبة','الوجبة','تاريخ المناسبة','العنوان','الأيتمات','الخصم %','المجموع','الربح','تاريخ الإنجاز']];
   d.forEach(b=>rows.push([b.id.slice(0,8),b.created_at.slice(0,10),b.name,b.phone,t(b.occasion),t(b.meal),b.event_date,b.address,(b.items||[]).map(l=>l.name+' x'+l.qty).join(' | '),b.discount,b.total,pf[b.id]?pf[b.id].profit:'',pf[b.id]?pf[b.id].completed_at.slice(0,10):'']));
   const csv='﻿'+rows.map(r=>r.map(csvEsc).join(',')).join('\r\n');
   const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='tabakhkum-orders-'+today()+'.csv';document.body.appendChild(a);a.click();a.remove();
  }catch(e){toast(errMsg(e))}
 };
 show('1');
}
async function admStaff(){
 const box=$('#abd');
 try{
  const d=await Q(sb.from('admins').select('user_id,role,perms,profiles(username)'));
  const mx=sv('max_staff',25);
  box.innerHTML=`<div class="mu">عدد الموظفين: ${d.filter(x=>x.role==='staff').length} / ${mx}</div><button class="btn sm" data-s="add">+ إضافة موظف</button>`+d.map(a=>`<div class="card oc" data-u="${a.user_id}"><b>@${esc(a.profiles&&a.profiles.username)}</b> <span class="chip">${a.role==='owner'?'المدير العام':'موظف'}</span><div class="mu">${a.role==='owner'?'كل الصلاحيات':PERMS.filter(p=>a.perms&&a.perms[p[0]]).map(p=>p[1]).join('، ')||'بدون صلاحيات'}</div>${a.role==='staff'?`<button class="btn sm sec" data-s="edit">تعديل الصلاحيات</button><button class="btn sm bad" data-s="rm">إزالة</button>`:''}</div>`).join('');
  box.onclick=async e=>{
   const b=e.target.closest('[data-s]');if(!b)return;const k=b.dataset.s;
   try{
    if(k==='add')return staffForm(null,{});
    const c=b.closest('.oc'),u=c.dataset.u,a=d.find(x=>x.user_id===u);
    if(k==='edit')return staffForm(a.profiles.username,a.perms||{});
    if(k==='rm'){if(!confirm(t('sure')))return;await Q(sb.rpc('remove_staff',{p_user:u}));admStaff()}
   }catch(x){toast(errMsg(x))}
  };
 }catch(e){box.innerHTML=`<div class="empty">${esc(errMsg(e))}</div>`}
}
function staffForm(uname,perms){
 const s=sheet(`<h3>${uname?'صلاحيات الموظف':'إضافة موظف'}</h3>
  <div class="mu">الموظف يجب أن يكون أنشأ حساباً في التطبيق أولاً، ثم تكتب اسم مستخدمه هنا.</div>
  <label>اسم مستخدم الموظف</label><input id="su" maxlength="14" value="${esc(uname||'')}" ${uname?'readonly':''}>
  <label>الصلاحيات</label>${PERMS.map(p=>`<label class="perm"><input type="checkbox" data-p="${p[0]}" ${perms&&perms[p[0]]?'checked':''}> ${p[1]}</label>`).join('')}
  <button class="btn" id="sg">حفظ</button>`);
 s.querySelector('#sg').onclick=async()=>{
  const u=s.querySelector('#su').value.trim();if(!u)return;
  const pm={};s.querySelectorAll('[data-p]').forEach(x=>pm[x.dataset.p]=x.checked);
  try{await Q(sb.rpc('add_staff',{p_username:u,p_perms:pm}));s.close();admStaff()}catch(e){toast(errMsg(e))}
 };
}
async function admSettings(){
 const box=$('#abd');
 await loadSettings();
 const F2=[['wa','رقم واتساب الطلبات (بصيغة 964...)'],['support_phone','رقم دعم 1'],['support_phone2','رقم دعم 2'],['goal','عدد التفاعلات لكل مكافأة'],['pct','نسبة خصم المكافأة %'],['lunch_close','ساعة إغلاق حجز الغداء لنفس اليوم'],['max_staff','أقصى عدد موظفين'],['wa_verify','رقم واتساب التوثيق (إن اختلف)']];
 const T2=[['show_book_btn','إظهار زر "احجز" تحت الريلز'],['require_verified','اشتراط الرقم الموثق للنشر والتعليق والطلب'],['wa_verify_on','إظهار زر توثيق الرقم عبر واتساب (فعّله بعد ربط Meta)']];
 let rw=[];try{rw=await Q(sb.from('rewards').select('id,pct,created_at,profiles(username)').eq('approved',false).order('created_at'))}catch(e){}
 box.innerHTML=F2.map(f=>`<label>${f[1]}</label><input data-k="${f[0]}" value="${esc(S.set[f[0]]||'')}">`).join('')+T2.map(f=>`<label class="perm"><input type="checkbox" data-k="${f[0]}" ${S.set[f[0]]==='1'?'checked':''}> ${f[1]}</label>`).join('')+
 `<button class="btn" id="ssv">حفظ الإعدادات</button><h3 style="margin-top:20px">إشعار عام لكل المستخدمين</h3><input id="bct" maxlength="80" placeholder="العنوان"><textarea id="bcb" rows="2" maxlength="300" placeholder="النص"></textarea><button class="btn sec" id="bcs">إرسال الإشعار</button><h3 style="margin-top:20px">مكافآت بانتظار الموافقة (${rw.length})</h3>`+
 rw.map(r=>`<div class="card oc" data-id="${r.id}"><b>@${esc(r.profiles&&r.profiles.username)}</b> - خصم ${r.pct}%<br><button class="btn sm" data-w="1">موافقة</button><button class="btn sm bad" data-w="0">رفض</button></div>`).join('');
 box.querySelector('#ssv').onclick=async()=>{
  try{
   const rows=[...box.querySelectorAll('[data-k]')].map(i=>({key:i.dataset.k,value:i.type==='checkbox'?(i.checked?'1':'0'):i.value.trim()}));
   await Q(sb.from('settings').upsert(rows));await loadSettings();toast('تم الحفظ');
  }catch(e){toast(errMsg(e))}
 };
 box.querySelector('#bcs').onclick=async()=>{try{await Q(sb.rpc('broadcast',{p_title:box.querySelector('#bct').value,p_body:box.querySelector('#bcb').value}));box.querySelector('#bct').value='';box.querySelector('#bcb').value='';toast('تم الإرسال')}catch(e){toast(errMsg(e))}};
 box.onclick=async e=>{const b=e.target.closest('[data-w]');if(!b)return;try{await Q(sb.rpc('approve_reward',{p_id:b.closest('.oc').dataset.id,p_ok:b.dataset.w==='1'}));admSettings()}catch(x){toast(errMsg(x))}};
}
